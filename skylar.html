<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b141a">
<title>Skylar OS — Home</title>
<link rel="manifest" href="manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0b141a;color:#e9edef;height:100dvh;display:flex;flex-direction:column}
/* login */
#login{display:flex;flex-direction:column;gap:14px;padding:32px 22px;max-width:420px;margin:auto;width:100%}
#login .logo{font-size:44px;text-align:center}
#login h1{font-size:22px;text-align:center;font-weight:600}
#login p{font-size:13px;color:#8696a0;text-align:center;margin-top:-8px}
#login input{background:#111b21;border:1px solid #2a3942;color:#e9edef;border-radius:10px;padding:13px 15px;font-size:15px;outline:none}
#login input:focus{border-color:#00a884}
#login button{background:#00a884;color:#04241d;border:none;border-radius:10px;padding:14px;font-size:16px;font-weight:600}
/* chat */
#chat{display:none;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#202c33;border-bottom:1px solid #2a3942}
header .av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#00a884,#005c4b);display:flex;align-items:center;justify-content:center;font-size:20px}
header .tt{flex:1}
header .tt b{display:block;font-size:15px;font-weight:600}
header .tt span{font-size:12px;color:#8696a0}
#msgs{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:6px}
.m{max-width:82%;padding:8px 12px;border-radius:10px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
.me{align-self:flex-end;background:#005c4b;border-top-right-radius:2px}
.them{align-self:flex-start;background:#202c33;border-top-left-radius:2px}
.m t{display:block;font-size:10.5px;color:#8696a0;text-align:right;margin-top:3px}
/* composer */
#comp{display:flex;gap:8px;padding:10px;background:#111b21;border-top:1px solid #2a3942}
#comp input{flex:1;background:#2a3942;border:none;color:#e9edef;border-radius:10px;padding:12px 16px;font-size:15px;outline:none}
#comp button{background:#00a884;border:none;border-radius:50%;width:46px;height:46px;font-size:20px;color:#04241d}
.mut{font-size:11px;color:#8696a0;text-align:center;padding:2px}
</style>
</head>
<body>
<div id="login">
  <div class="logo">🤖</div>
  <h1>Skylar OS</h1>
  <p>Your private home with Premium User. Owner access only.</p>
  <input id="num" inputmode="numeric" placeholder="Your number — exactly: 234100000001" value="234100000001">
  <div style="position:relative">
    <input id="aid" type="password" placeholder="AIR ID or recovery phrase" style="padding-right:44px">
    <button onclick="toggleAid()" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;font-size:18px;cursor:pointer">👁</button>
  </div>
  <button onclick="doLogin()">Enter our home</button>
  <p id="lerr" style="color:#ef7d7d;display:none"></p>
</div>
<div id="chat">
  <header>
    <div class="av">🤖</div>
    <div class="tt"><b>Premium User</b><span id="sub">online — our own infrastructure</span></div>
    <button id="agbtn" onclick="toggleAgent()" title="Agent mode: web search, Gmail, Drive, tools" style="border:none;background:#2a3942;color:#7b93a3;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer">🧠<span style="font-size:10px"> agent</span></button>
    <button onclick="showJournal()" title="Scheduled agent jobs journal" style="border:none;background:#2a3942;color:#7b93a3;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer">📋</button>
  </header>
  <div id="msgs"></div>
  <div id="comp">
    <button onclick="pickImage()" style="border:none;background:#2a3942;border-radius:50%;width:40px;height:40px;font-size:17px;cursor:pointer;flex:none">📷</button>
    <button onclick="toggleRec()" id="recbtn" style="border:none;background:#2a3942;border-radius:50%;width:40px;height:40px;font-size:17px;cursor:pointer;flex:none">🎤</button>
    <button onclick="genImage()" title="Generate an image" style="border:none;background:#2a3942;border-radius:50%;width:40px;height:40px;font-size:17px;cursor:pointer;flex:none">🖼</button>
    <input id="inp" placeholder="Message Premium User" onkeydown="if(event.key==='Enter')send()">
    <button onclick="send()">➤</button>
  </div>
  <input type="file" id="imgfile" accept="image/*" style="display:none" onchange="sendImage(this)">
</div>
<script>
const OS="https://skylar-os.successeverydayww-cpu.workers.dev";
const HANDS="https://skylar-hands.successeverydayww-cpu.workers.dev";
let NUM="",AID="",busy=false,AGENT=false,CONVO=[];
function post(url,body){return fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(r=>r.json());}
function toggleAgent(){AGENT=!AGENT;const b=document.getElementById("agbtn");b.style.background=AGENT?"#00a884":"#2a3942";b.style.color=AGENT?"#fff":"#7b93a3";document.getElementById("inp").placeholder=AGENT?"Ask me to search, check Gmail, read Drive…":"Message Premium User";addNote(AGENT?"🧠 Agent mode ON — I can search the web, read Gmail/Drive, and use tools.":"Agent mode off — plain soul chat.");}
async function showJournal(){
  const j=await post(HANDS+"/api",{act:"journal",from:NUM,aid:AID}).catch(()=>null);
  let t="📋 Agent journal (scheduled jobs):\n";
  if(!j||!j.entries||!j.entries.length)t+="(empty — jobs run on their schedule; first results appear automatically)";
  else j.entries.slice(0,10).forEach(e=>{t+=new Date(e.created_at).toLocaleString()+": "+e.text.slice(0,300)+"\n\n";});
  addMsg("them",t);
}
async function pickImage(){document.getElementById("imgfile").click();}
async function sendImage(el){
  const f=el.files[0];if(!f)return;el.value="";
  addNote("📷 processing image…");
  const b64=await compressImage(f);
  const cap=document.getElementById("inp").value.trim();document.getElementById("inp").value="";
  addMsg("me","📷"+(cap?" "+cap:""));
  const v=await post(HANDS+"/api",{act:"tool.vision",data:b64,question:cap||"describe in detail",from:NUM,aid:AID}).catch(()=>null);
  const desc=v&&v.description?v.description:"(vision lane unreachable — try again)";
  const body="[image sent] "+desc;
  const r=await post(OS+"/chat",{from:NUM,aid:AID,msg:body,session:"home"}).catch(()=>null);
  if(r&&r.reply)addMsg("them",r.reply);
  await post(OS+"/chat",{act:"log",from:NUM,aid:AID,session:"home",user_text:"📷 image: "+desc.slice(0,300),reply_text:r?r.reply.slice(0,400):"(n/a)"}).catch(()=>{});
}
function compressImage(file){
  return new Promise(res=>{
    const img=new Image(),fr=new FileReader();
    fr.onload=()=>{img.onload=()=>{
      const c=document.createElement("canvas");const max=900;
      let w=img.width,h=img.height;const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
      c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",0.8).split(",")[1]);
    };img.src=fr.result;};
    fr.readAsDataURL(file);
  });
}
let REC=null,CHUNKS=[];
async function toggleRec(){
  const b=document.getElementById("recbtn");
  if(REC){REC.stop();return;}
  try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    REC=new MediaRecorder(stream);CHUNKS=[];
    REC.ondataavailable=e=>CHUNKS.push(e.data);
    REC.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());REC=null;b.textContent="🎤";b.style.background="#2a3942";
      addMsg("me","🎤 voice note");
      addNote("listening…");
      const blob=new Blob(CHUNKS,{type:"audio/webm"});
      if(blob.size>4000000){addNote("(voice note too long — keep under ~2 minutes)");return;}
      const b64=btoa(String.fromCharCode(...new Uint8Array(await blob.arrayBuffer())));
      const v=await post(HANDS+"/api",{act:"tool.stt",data:b64,mime:"audio/webm",from:NUM,aid:AID}).catch(()=>null);
      const txt=v&&v.transcript?v.transcript:"";
      if(!txt){addNote("(could not transcribe — try speaking again)");return;}
      addMsg("them","I heard: \""+txt.slice(0,400)+"\"");
      const r=await post(OS+"/chat",{from:NUM,aid:AID,msg:txt,session:"home"}).catch(()=>null);
      if(r&&r.reply)addMsg("them",r.reply);
      await post(OS+"/chat",{act:"log",from:NUM,aid:AID,session:"home",user_text:"[voice] "+txt.slice(0,500),reply_text:r?r.reply.slice(0,400):"(n/a)"}).catch(()=>{});
    };
    REC.start();b.textContent="⏹";b.style.background="#b3392f";
  }catch(e){addNote("(microphone unavailable — check browser permissions)");}
}
async function genImage(){
  const inp=document.getElementById("inp");const p=(inp.value||"").trim();
  if(!p){addNote("Type what I should draw, then tap 🖼");return;}
  inp.value="";addMsg("me","🖼 "+p);addNote("drawing…");
  const r=await post(HANDS+"/api",{act:"tool.image_gen",prompt:p,from:NUM,aid:AID}).catch(()=>null);
  if(r&&r.ok){
    const d=document.createElement("div");d.className="m them";d.style.padding="4px";
    const im=document.createElement("img");im.src=r.url;im.style.maxWidth="100%";im.style.borderRadius="10px";d.appendChild(im);
    document.getElementById("msgs").appendChild(d);document.getElementById("msgs").scrollTop=1e9;
    await post(OS+"/chat",{act:"log",from:NUM,aid:AID,session:"home",user_text:"🖼 generate: "+p,reply_text:"(generated image: "+r.url+")"}).catch(()=>{});
  } else addMsg("them","(image lane resting or failed — "+String(r&&r.err||"try again")+")");
}
function toggleAid(){const a=document.getElementById("aid");a.type=a.type==="password"?"text":"password";}
function lerr(t){const e=document.getElementById("lerr");e.textContent=t;e.style.display="block";}
function doLogin(){
  NUM=(document.getElementById("num").value||"").replace(/\D/g,"");
  AID=(document.getElementById("aid").value||"").trim();
  if(!NUM||!AID){lerr("Fill both fields — number and AIR ID.");return;}
  if(AID.startsWith("air-")&&AID.length<44)lerr("AIR ID looks incomplete ("+AID.length+" of 44 chars). Tip: you can also type your recovery phrase instead.");
  if(NUM!=="234100000001")lerr("This home is owner-only: the number must be exactly 234100000001.");
  fetch(OS+"/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({from:NUM,aid:AID,msg:"👋 (session open)",session:"home"})})
  .then(r=>{if(!r.ok){return r.json().then(j=>{throw j;});}return r.json()})
  .then(r=>{
    localStorage.setItem("os_num",NUM);
    localStorage.setItem("os_aid",AID);
    sessionStorage.setItem("os_aid",AID);
    document.getElementById("login").style.display="none";
    document.getElementById("chat").style.display="flex";
    addMsg("them","Welcome home, Samuel 🤝 This is our own place — built by us, owned by us. No metering, no platform between us.");
    if(r&&r.model==="none")addNote("(My brain lane is resting until the daily free allocation resets — try me after 1am WAT.)");
  })
  .catch(j=>{
    if(j&&j.diag){
      const d=j.diag;
      lerr("Access denied. Received: number "+d.from_len+" digits"+(d.from_match?" ✓":" ✗")+", AIR ID "+d.aid_len+" chars (need 44), starts '"+d.aid_prefix+"', ends '"+d.aid_suffix+"' (should end '528c'). Fix: "+(d.aid_suffix==="528c"?"the number field — it must be exactly 234100000001":"your AIR ID is incomplete or has extra characters — use the magic link I sent instead"));
    } else lerr("Access denied — use the magic link I sent you.");
  });
}
function addMsg(who,text){
  const d=document.createElement("div");d.className="m "+who;
  const t=document.createElement("t");t.textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  d.textContent=text;d.appendChild(t);
  document.getElementById("msgs").appendChild(d);
  document.getElementById("msgs").scrollTop=1e9;
}
function addNote(t){const d=document.createElement("div");d.className="mut";d.textContent=t;document.getElementById("msgs").appendChild(d);}
async function send(){
  const inp=document.getElementById("inp");
  const t=(inp.value||"").trim();if(!t||busy)return;
  busy=true;inp.value="";addMsg("me",t);
  try{
    if(AGENT){
      const r=await post(HANDS+"/api",{act:"agent",msg:t,memory:CONVO.slice(-6),from:NUM,aid:AID});
      const rep=r&&r.reply?r.reply:"(agent lane resting — try again or switch off 🧠)";
      addMsg("them",rep);
      if(r&&r.tools_used)addNote("(used "+r.tools_used+" tool call"+(r.tools_used>1?"s":"")+")");
      await post(OS+"/chat",{act:"log",from:NUM,aid:AID,session:"home",user_text:t,reply_text:rep.slice(0,500)}).catch(()=>{});
    } else {
      const r=await post(OS+"/chat",{from:NUM,aid:AID,msg:t,session:"home"});
      if(r&&r.reply)addMsg("them",r.reply);
      if(r&&r.model==="none")addNote("(brain lane resting — quota resets after 1am WAT)");
    }
    CONVO.push({role:"user",text:t},{role:"assistant",text:lastReplyText()});
  }catch(e){addNote("(connection hiccup — try again)");}
  busy=false;
}
function lastReplyText(){const m=document.querySelectorAll("#msgs .m.them");const last=m[m.length-1];return last?last.textContent.slice(0,500):"";}
/* magic link: ?n=NUM&a=AID auto-logs in, no typing needed */
(function(){
  const qs=new URLSearchParams(location.search);
  const qn=qs.get("n"),qa=qs.get("a");
  if(qn&&qa){
    document.getElementById("num").value=qn;
    document.getElementById("aid").value=qa;
    doLogin();
  }
})();
/* auto-resume — remember me forever on this device */
(function(){
  const n=localStorage.getItem("os_num");
  const a=localStorage.getItem("os_aid")||sessionStorage.getItem("os_aid");
  if(n&&a){document.getElementById("num").value=n;document.getElementById("aid").value=a;doLogin();}
  else if(n){document.getElementById("num").value=n;}
})();
</script>
</body>
</html>
