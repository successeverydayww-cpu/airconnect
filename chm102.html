<script>
const DATA=[{"n": 1, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "For a reaction following pseudo-first-order kinetics, such as the acid-catalyzed hydrolysis of methyl ethanoate: CH3COOCH3 + H2O → CH3OH + CH3COOH. Which statement best explains why the reaction displays overall first-order behavior despite involving two reactants?", "opts": ["Water acts as a catalyst and is regenerated at the end of the step.", "Water is present in such large excess that its concentration remains virtually constant.", "The rate constant k is independent of temperature.", "The activation energy for water is zero."], "ans": "B", "exp": "In pseudo-first-order reactions (like ester hydrolysis in water), water is present in such large excess that its concentration remains virtually constant. Thus, k'[H2O] is combined into an effective single rate constant k, giving Rate = k[ester]."}, {"n": 2, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "A first-order reaction has a rate constant k. What fraction of the original reactant concentration [A]0 remains after a time equal to t = (ln 3) / k?", "opts": ["1/3", "2/3", "1/e3", "3/4"], "ans": "A", "exp": "For 1st order kinetics, ln([A]0 / [A]t) = kt. Substituting t = (ln 3) / k yields k · [(ln 3)/k] = ln 3. Thus, [A]0 / [A]t = 3, so [A]t = (1/3)[A]0."}, {"n": 3, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "If the plot of 1/[A] against time t yields a straight line with a positive slope k, what are the correct units for k assuming concentration is in mol·L-1 and time is in seconds?", "opts": ["s-1", "L·mol-1·s-1", "mol·L-1·s-1", "L2·mol-2·s-1"], "ans": "B", "exp": "The second-order integrated rate law is 1/[A]t - 1/[A]0 = kt. Units of 1/[A] are L/mol. Dividing by time (s) gives L·mol-1·s-1 (or M-1s-1)."}, {"n": 4, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "Consider a zero-order reaction A → Product. If the initial concentration [A]0 is doubled, how does the half-life t1/2 change?", "opts": ["It remains unchanged.", "It is halved.", "It doubles.", "It increases by a factor of four ."], "ans": "C", "exp": "For zero-order reactions, t1/2 = [A]0 / (2k). The half-life is directly proportional to initial concentration [A]0. Doubling [A]0 doubles t1/2."}, {"n": 5, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "Data from a sucrose hydrolysis experiment shows concentration decreasing over time: t=0 h, [S]=0.50 M; t=0.51 h, [S]=0.45 M; t=1.0 h, [S]=0.404 M; t=1.5 h, [S]=0.363 M. Which mathematical property confirms this process is first-order?", "opts": ["[A]t - [A]0 is constant over equal time intervals.", "The ratio [A]t / [A]0 decreases linearly with time.", "The natural log ratio ln([A]0 / [A]t) / t remains approximately constant.", "t1/2 is directly proportional to [A]0."], "ans": "C", "exp": "First-order kinetics require k = (1/t) ln([A]0 / [A]t) to remain constant. Calculating at t=0.51h gives k ≈ 0.207 h-1, and at t=1.0h gives k ≈ 0.213 h-1, demonstrating constant rate behavior ."}, {"n": 6, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "For a second-order reaction A → Product with rate law Rate = k[A]2, if [A]0 = 0.086 M and k = 7 × 109 M-1s-1, why is solving for [A] at t = 20 min physically indicative of an extremely fast reaction?", "opts": ["Because k is extremely small, making half-life days long.", "Because k gives a half-life on the order of nanoseconds at 0.086 M, meaning reactant is virtually depleted in seconds.", "Second-order reactions cannot occur in solution.", "The half-life of a second-order reaction is independent of initial concentration."], "ans": "B", "exp": "t1/2 = 1 / (k[A]0) = 1 / [(7 × 109)(0.086)] ≈ 1.66 × 10-9 s. With a half-life in nanoseconds, the reactant is virtually depleted in seconds, making a 20-minute timeframe physically trivial."}, {"n": 7, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "Radioactive decay follows first-order kinetics. If a sample of a radioisotope degrades to 25% of its original activity in 10 hours, what is its half-life?", "opts": ["2.5 hours", "5.0 hours", "7.5 hours", "10.0 hours"], "ans": "B", "exp": "Decay to 25% (1/4) corresponds to 2 half-lives (100% → 50% → 25%). 2 t1/2 = 10 hours ⇒ t1/2 = 5.0 hours."}, {"n": 8, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "For the elementary step aA + bB → Products, the overall reaction order is defined as:", "opts": ["a × b", "a - b", "a + b", "a / b"], "ans": "C", "exp": "For an elementary step, the overall order is the sum of the stoichiometric coefficients of reactants in the rate law: Order = a + b."}, {"n": 9, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "In a zero-order reaction, what is the slope of the plot of reactant concentration [A] versus time t?", "opts": ["k", "-k", "-k / 2.303", "1 / k"], "ans": "B", "exp": "The zero-order equation is [A]t = -kt + [A]0. A plot of [A]t vs t is a straight line with slope = -k."}, {"n": 10, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "What is the fundamental difference in concentration dependency between the half-life of a 1st order reaction and a 2nd order reaction (A → Products)?", "opts": ["1st order half-life depends on [A]0; 2nd order half-life is independent of [A]0.", "1st order half-life is independent of [A]0; 2nd order half-life is inversely proportional to [A]0.", "Both are inversely proportional to [A]0.", "Both are directly proportional to [A]0."], "ans": "B", "exp": "First-order half-life t1/2 = (ln 2)/k (independent of initial concentration). Second-order half-life t1/2 = 1/ (k[A]0) (inversely proportional to [A]0)."}, {"n": 11, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "Enzymatic decomposition of ethanol in the human liver via alcohol dehydrogenase displays what reaction order under saturated enzyme conditions?", "opts": ["First order", "Second order", "Zero order", "Third order"], "ans": "C", "exp": "Under saturated enzyme conditions, all active sites are occupied. The reaction rate reaches maximum velocity (Vmax) and becomes independent of substrate concentration (zero order)."}, {"n": 12, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "The integrated rate law for a first-order reaction can be expressed as:", "opts": ["[A]t - [A]0 = -kt", "ln[A]t - ln[A]0 = -kt", "1/[A]t - 1/[A]0 = kt", "[A]t 2 - [A]0 2 = -kt"], "ans": "B", "exp": "Integration of -d[A]/[A] = k dt gives ln[A]t - ln[A]0 = -kt."}, {"n": 13, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "For the reaction C4H8 → 2C2H4 (cyclobutane to ethylene), if the rate of disappearance of C4H8 is 1.5 × 10-3 M·s-1, what is the rate of formation of C2H4?", "opts": ["0.75 × 10-3 M·s-1", "1.5 × 10-3 M·s-1", "3.0 × 10-3 M·s-1", "6.0 × 10-3 M·s-1"], "ans": "C", "exp": "Stoichiometry dictates 1 mol cyclobutane yields 2 mol ethylene. Rate of formation of ethylene = 2 × (rate of disappearance) = 2 × (1.5 × 10-3) = 3.0 × 10-3 M·s-1."}, {"n": 14, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "A plot of ln[A]t versus t gives a straight line. The intercept on the y-axis corresponds to:", "opts": ["-k", "[A]0", "ln[A]0", "t1/2"], "ans": "C", "exp": "Linear form: ln[A]t = -kt + ln[A]0 (y = mx + c). The y-intercept c = ln[A]0."}, {"n": 15, "section": "CHEMICAL KINETICS & RATE LAWS", "q": "If a reaction's rate triples when the concentration of a reactant is tripled, what is the order with respect to that reactant?", "opts": ["0", "1", "2", "3 SECTION 2: ORGANIC REACTION TYPES & MECHANISMS"], "ans": "B", "exp": "Rate ∝ [A]n. Tripling [A] triples Rate (31 = 3), confirming order n = 1."}, {"n": 16, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "In the reaction of asymmetric alkenes with hydrogen halides (e.g., CH3-CH=CH2 + HBr), according to Markovnikov's rule, where does the hydrogen atom attach?", "opts": ["To the carbon with fewer hydrogen atoms.", "To the carbon that already carries the greater number of hydrogen atoms.", "Equally to both carbon atoms.", "To the halogen atom."], "ans": "B", "exp": "Markovnikov's rule states that hydrogen adds to the double-bond carbon containing more hydrogen atoms to generate the more stable carbocation intermediate."}, {"n": 17, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "Identify the major product formed when 2-methylbut-2-ene reacts with HBr in the absence of peroxides:", "opts": ["2-bromo-3-methylbutane", "2-bromo-2-methylbutane", "1-bromo-2-methylbutane", "3-bromo-2-methylbutane"], "ans": "B", "exp": "Protonation of 2-methylbut-2-ene yields a tertiary carbocation at C-2 rather than a secondary one at C-3. Bromide attacks C-2 to give 2-bromo-2-methylbutane."}, {"n": 18, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "What classification describes the conversion of ethyl chloride (CH3CH2Cl) to ethanol (CH3CH2OH) using aqueous NaOH?", "opts": ["Electrophilic addition", "Nucleophilic substitution", "Free-radical elimination", "Rearrangement"], "ans": "B", "exp": "Nucleophilic substitution occurs as OH- replaces Cl- on the alkyl substrate."}, {"n": 19, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "Which reagent acts as a reducing agent to convert aldehydes, ketones, or carboxylic acid derivatives to alcohols?", "opts": ["CrO3 / H2SO4", "LiAlH4", "KMnO4", "Br2 / FeBr3"], "ans": "B", "exp": "Lithium aluminium hydride (LiAlH4) donates hydride ions (H-) to reduce carbonyl and carboxyl functional groups to alcohols."}, {"n": 20, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "The acid-catalyzed dehydration of ethanol (CH3CH2OH + H2SO4 → CH2=CH2 + H2O) is an example of what reaction type?", "opts": ["Addition", "Substitution", "Elimination", "Oxidation"], "ans": "C", "exp": "Dehydration removes H and OH from adjacent carbon atoms to create an alkene double bond (elimination)."}, {"n": 21, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "In an addition polymerization reaction (such as n CH2=CH2 → -[CH2-CH2]n-):", "opts": ["Water is eliminated as a byproduct.", "Monomers join without eliminating any small molecules.", "Carbon dioxide is evolved.", "The polymer has a lower molecular weight than the monomer ."], "ans": "B", "exp": "In addition polymerization, double bonds open to form single bonds linking units without loss of any small molecules or atoms."}, {"n": 22, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "How does condensation polymerization differ fundamentally from addition polymerization?", "opts": ["Addition polymerization produces a byproduct like H2O, while condensation does not.", "Condensation polymerization involves the elimination of a small molecule (such as H2O or HCl), whereas addition polymerization does not eliminate any atoms.", "Condensation polymerization only occurs with alkanes.", "Addition polymerization requires ionic catalysts exclusively."], "ans": "B", "exp": "Condensation polymerization links monomers with simultaneous loss of small molecules (like water or HCl), whereas addition polymerization loses no atoms."}, {"n": 23, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "The conversion of 1-butene to 2-butene in the presence of an acid catalyst is classified as a(n):", "opts": ["Addition reaction", "Substitution reaction", "Rearrangement reaction", "Condensation reaction"], "ans": "C", "exp": "Isomerization of 1-butene to 2-butene rearranges atomic bonds within the molecule without altering molecular formula or adding/removing atoms."}, {"n": 24, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "In nucleophilic substitution (R-L + Nu- → R-Nu + L-), what role does L- play?", "opts": ["Substrate", "Electrophile", "Leaving group", "Catalyst"], "ans": "C", "exp": "In R-L + Nu- → R-Nu + L-, L- leaves with the bonding pair and is the leaving group."}, {"n": 25, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "Oxidation of a primary alcohol (CH3CH2OH) with a strong oxidizing agent like acidified CrO3 yields:", "opts": ["A secondary alcohol", "A ketone", "A carboxylic acid (CH3COOH)", "An alkane"], "ans": "C", "exp": "Primary alcohols oxidize first to aldehydes, which further oxidize under strong conditions (CrO3) to carboxylic acids."}, {"n": 26, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "Reduction involves which of the following processes in organic chemistry?", "opts": ["Gain of oxygen atoms", "Loss of hydrogen atoms", "Gain of hydrogen atoms or gain of electrons", "Loss of electrons only"], "ans": "C", "exp": "Organic reduction involves gaining hydrogen atoms, losing oxygen atoms, or gaining electrons."}, {"n": 27, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "What is the major product formed from the dehydrohalogenation of 2-bromobutane with alcoholic KOH?", "opts": ["1-butene", "2-butene", "Cyclobutane", "Butan-2-ol"], "ans": "B", "exp": "According to Zaitsev's rule, elimination yields the more substituted and thermodynamically stable alkene (2-butene as major product)."}, {"n": 28, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "What characterization applies to an electrophile in an organic mechanism?", "opts": ["Electron-pair donor (Lewis base)", "Electron-pair acceptor (Lewis acid)", "Neutral species with a full octet that donates protons", "An anion seeking positive charge"], "ans": "B", "exp": "Electrophiles are electron-loving species that act as Lewis acids by accepting electron pairs from electron- rich sources."}, {"n": 29, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "Which of the following species is a strong nucleophile?", "opts": ["H+", "NO2 +", "OH-", "BF3"], "ans": "C", "exp": "The hydroxide ion (OH-) carries a negative charge and unshared electron pairs, acting as a powerful nucleophile."}, {"n": 30, "section": "ORGANIC REACTION TYPES & MECHANISMS", "q": "Hydrogenation of an alkene (CH2=CH2 + H2 → CH3-CH3) represents which pair of reaction categories?", "opts": ["Elimination and Oxidation", "Addition and Reduction", "Substitution and Hydrolysis", "Rearrangement and Condensation SECTION 3: STEREOCHEMISTRY & ISOMERISM"], "ans": "B", "exp": "Hydrogenation adds H2 across a double bond (addition) while reducing the oxidation state of the carbons (reduction)."}, {"n": 31, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Propanone (CH3COCH3) and Propanal (CH3CH2CHO) are examples of:", "opts": ["Enantiomers", "Constitutional (functional group) isomers", "Diastereomers", "Geometric isomers"], "ans": "B", "exp": "Propanone and propanal share formula C3H6O but have different functional groups (ketone vs aldehyde), making them constitutional isomers."}, {"n": 32, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Ethanol (CH3CH2OH) and Dimethyl ether (CH3OCH3) share the same molecular formula C2H6O. They are:", "opts": ["Stereoisomers", "Constitutional isomers", "Conformers", "Anomers"], "ans": "B", "exp": "Ethanol and dimethyl ether have identical molecular formulas (C2H6O) but different atom connectivity (constitutional isomers)."}, {"n": 33, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "What condition must be met for a carbon atom to be designated as a chiral (stereogenic) center?", "opts": ["It must be sp2 hybridized.", "It must be bonded to four different atoms or groups.", "It must be part of a double bond.", "It must be bonded to at least two hydrogen atoms."], "ans": "B", "exp": "A chiral center is an sp3 hybridized carbon attached to four completely distinct substituents."}, {"n": 34, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Enantiomers are stereoisomers that are:", "opts": ["Superimposable mirror images", "Non-superimposable mirror images", "Non-mirror image stereoisomers", "Structural isomers with different connectivity"], "ans": "B", "exp": "Enantiomers are chiral stereoisomers that are non-superimposable mirror images of each other ."}, {"n": 35, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Which physical property differs between two pure enantiomers?", "opts": ["Boiling point", "Melting point", "Direction of rotation of plane-polarized light", "Density"], "ans": "C", "exp": "Enantiomers have identical physical properties (bp, mp, density) except for the direction in which they rotate plane-polarized light."}, {"n": 36, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "A 50:50 (equimolar) mixture of two enantiomers is optically inactive. This mixture is called a:", "opts": ["Meso compound", "Racemic mixture (racemate)", "Polymer", "Anomer"], "ans": "B", "exp": "An equimolar 50:50 mixture of two enantiomers cancels out optical rotations, forming an optically inactive racemic mixture."}, {"n": 37, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Consider 1,4-dimethylcyclohexane. The isomer with both methyl groups pointing in the same direction (e.g., both wedged/going out) is the:", "opts": ["Trans-isomer", "Cis-isomer", "Erythro-isomer", "Threo-isomer"], "ans": "B", "exp": "When both substituents lie on the same face of the ring (both pointing out/wedged), the structure is the cis- isomer ."}, {"n": 38, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "What is the key stereochemical distinction between cis and trans isomers in ring structures or double bonds?", "opts": ["They have different atom connectivity.", "They are non-superimposable mirror images.", "They are configurational stereoisomers that cannot interconvert without breaking bonds.", "They interconvert rapidly at room temperature without breaking bonds."], "ans": "C", "exp": "Cis/trans isomers are configurational stereoisomers that cannot interconvert without breaking carbon- carbon double bonds or ring bonds."}, {"n": 39, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "For a compound with two distinct chiral centers, what is the maximum theoretical number of stereoisomers according to the 2n rule?", "opts": ["2", "4", "6", "8"], "ans": "B", "exp": "Maximum stereoisomers = 2n. For n = 2 distinct chiral centers, 22 = 4 stereoisomers."}, {"n": 40, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Erythro and Threo configurations (e.g., 3-bromo-2-butanol) are types of:", "opts": ["Constitutional isomers", "Diastereomers", "Enantiomers", "Tautomers"], "ans": "B", "exp": "Erythro and threo configurations describe pairs of stereoisomers with two chiral centers that are non- mirror images (diastereomers)."}, {"n": 41, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "A compound containing multiple chiral centers that possesses a plane of symmetry and is optically inactive is called a:", "opts": ["Racemate", "Meso compound", "Enantiomer", "Conformational isomer"], "ans": "B", "exp": "Meso compounds possess multiple chiral centers but also an internal symmetry plane, making the overall molecule achiral and optically inactive."}, {"n": 42, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Dextrorotatory compounds rotate plane-polarized light in which direction?", "opts": ["Counter-clockwise (anti-clockwise)", "Clockwise", "180 degrees downwards", "They do not rotate light"], "ans": "B", "exp": "Dextrorotatory (+ or d) compounds rotate plane-polarized light in a clockwise direction."}, {"n": 43, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Which of the following molecules contains a chiral carbon atom?", "opts": ["1-chlorobutane", "2-chlorobutane", "Propan-2-ol", "Ethene"], "ans": "B", "exp": "C-2 of 2-chlorobutane is bonded to four different groups (-H, -Cl, -CH3, -CH2CH3), making it chiral."}, {"n": 44, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Optical activity is measured using an instrument called a:", "opts": ["Spectrophotometer", "Mass spectrometer", "Polarimeter", "Chromatograph"], "ans": "C", "exp": "A polarimeter measures the degree and direction of optical rotation of plane-polarized light passing through a chiral solution."}, {"n": 45, "section": "STEREOCHEMISTRY & ISOMERISM", "q": "Why do enantiomers display identical chemical reactivity toward achiral reagents?", "opts": ["Because they have the same empirical formula only.", "Because their intermolecular forces and internal bond energies with achiral environments are identical.", "Because they interconvert instantaneously.", "Because let picks=Array(50).fill(null), graded=false;
const list=document.getElementById('list');
let lastSec='', html='';
DATA.forEach(function(q,i){
  if(q.section!==lastSec){html+='<div class="sechead">'+q.section+'</div>';lastSec=q.section;}
  html+='<div class="card" id="c'+i+'"><div class="qmeta"><span class="qnum">Q'+q.n+'</span><span class="qtag">'+(i+1)+' of 50</span></div><div class="qtext">'+q.q+'</div>';
  q.opts.forEach(function(o,j){
    html+='<div class="opt" id="o'+i+'_'+j+'" onclick="pick('+i+','+j+')"><span class="key">'+'ABCD'[j]+'</span><span>'+o+'</span></div>';
  });
  html+='<div class="verdict" id="v'+i+'"></div><div class="exp"><b>EXPLANATION</b>'+q.exp+'</div></div>';
});
list.innerHTML=html;
function pick(i,j){
  if(graded)return;
  picks[i]=j;
  for(let k=0;k<4;k++)document.getElementById('o'+i+'_'+k).classList.toggle('sel',k===j);
  document.getElementById('prog').textContent=picks.filter(function(p){return p!==null}).length+' / 50 answered';
}
function grade(){
  if(graded)return;
  const un=picks.filter(function(p){return p===null}).length;
  let correct=0;
  DATA.forEach(function(q,i){
    const a='ABCD'.indexOf(q.ans);
    for(let k=0;k<4;k++){
      const el=document.getElementById('o'+i+'_'+k);
      el.classList.add('dis');el.classList.remove('sel');
      if(k===a)el.classList.add('correct');
      else if(picks[i]===k)el.classList.add('miss');
    }
    const card=document.getElementById('c'+i), v=document.getElementById('v'+i);
    card.classList.add('done');
    if(picks[i]===a){correct++;card.classList.add('right');v.textContent='✔ Correct';v.className='verdict ok';}
    else{card.classList.add('wrong');v.textContent=picks[i]===null?'— Not answered':'✘ Wrong';v.className='verdict no';}
  });
  graded=true;
  const pct=Math.round(correct/50*100);
  document.getElementById('scoreN').textContent=correct+'/50';
  document.getElementById('scoreD').textContent=correct+' correct · '+(50-correct-un)+' wrong · '+un+' unanswered · '+pct+'%';
  document.getElementById('scoreM').textContent=pct>=70?'Excellent — pass mark cleared.':(pct>=50?'Fair. Review the explanations and retake.':'Study the explanations below, then retake.');
  const s=document.getElementById('score');s.classList.add('show');
  s.scrollIntoView({behavior:'smooth'});
  document.getElementById('submit').style.display='none';
  document.getElementById('reset').style.display='block';
}
function resetAll(){
  graded=false;picks=Array(50).fill(null);
  document.querySelectorAll('.opt').forEach(function(e){e.classList.remove('sel','correct','miss','dis');});
  document.querySelectorAll('.card').forEach(function(e){e.classList.remove('done','right','wrong');});
  document.querySelectorAll('.verdict').forEach(function(e){e.textContent='';});
  document.getElementById('score').classList.remove('show');
  document.getElementById('submit').style.display='block';
  document.getElementById('reset').style.display='none';
  document.getElementById('prog').textContent='0 / 50 answered';
  window.scrollTo({top:0,behavior:'smooth'});
}
</script></body></html>
