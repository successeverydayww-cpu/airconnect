  <circle cx="296" cy="145" r="20" fill="#E8B84B" stroke="#F6DDA8" stroke-width="3"/>
  <circle cx="324" cy="353" r="18" fill="#5B8DEF" stroke="#A9C4F5" stroke-width="3"/>
