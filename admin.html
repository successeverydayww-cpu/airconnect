<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>AirConnect Analytics</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{background:#0B1220;color:#E2E8F0;margin:0;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:18px}h2{font-size:13px;color:#94A3B8;margin:22px 0 8px}
.m{background:#13223A;border:1px solid #2A3B5C;border-radius:12px;padding:12px 14px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}
.m .v{font-size:20px;font-weight:700;color:#0EA5E9}
.m .k{font-size:12.5px;color:#94A3B8}
button{background:#0C4A6E;color:#fff;border:0;border-radius:10px;padding:11px;width:100%;font-size:14px;font-weight:600;cursor:pointer}
.day{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px;color:#94A3B8}
.day .bar{height:12px;background:#0EA5E9;border-radius:6px;min-width:3px}
.sub{font-size:11px;color:#64748B;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<h1>📊 AirConnect Analytics</h1>
<div class="sub">Private dashboard — data pulls live from the trunk for the owner number only.</div>
<button onclick="loadStats()">Load live stats</button>
<div id="out" style="margin-top:14px">Tap the button — numbers load in ~2 seconds.</div>
<h2>Signups by day</h2>
<div id="days"></div>
<script>
async function loadStats(){
  const out=document.getElementById("out");
  out.innerHTML="Loading…";
  try{
    const r=await fetch("https://airconnect-api.successeverydayww-cpu.workers.dev",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({act:"stats2",node:"234100000001"})});
    const d=await r.json();
    if(d.err){out.innerHTML="⚠ "+d.err;return;}
    const rows=[
      ["Total users",d.total_users],["Signed up last 24h",d.users_signed_up_24h],
      ["Friend pairs",d.friend_pairs],["Pending friend requests",d.pending_requests],
      ["Groups",d.groups],["Group messages (recent)",d.group_msgs_recent],
      ["Chat messages archived",d.chat_history_rows],["Reactions",d.reactions],
      ["Active statuses",d.active_statuses_24h],["Calls offered (recent)",d.calls_offered_24h],
      ["Push subscribers",d.push_subscribers],["Bans",d.bans]];
    out.innerHTML=rows.map(x=>'<div class="m"><span class="k">'+x[0]+'</span><span class="v">'+x[1]+"</span></div>").join("");
    const days=d.signups_by_day||{};
    const keys=Object.keys(days).sort().slice(-14);
    const mx=Math.max(1,...keys.map(k=>days[k]));
    document.getElementById("days").innerHTML=keys.map(k=>'<div class="day"><span style="min-width:80px">'+k+'</span><span class="bar" style="width:'+Math.round(days[k]/mx*220)+'px"></span><span>'+days[k]+"</span></div>").join("")||"No signups yet.";
  }catch(e){out.innerHTML="⚠ Could not reach the trunk";}
}
</script>
</body>
</html>
