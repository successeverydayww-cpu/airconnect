  .card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(15,23,42,.08)}
  .card h2{margin:0 0 10px;font-size:15px;color:var(--g)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid #E2E8F0;background:#fff;color:var(--ink);border-radius:20px;padding:8px 14px;font-size:13.5px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--g);border-color:var(--g);color:#fff}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;margin-top:8px}
  .btn.g{background:var(--g2);color:#fff}
  .btn.o{background:#E2E8F0;color:#334155}
  .note{font-size:12.5px;color:var(--mut);margin-top:8px;line-height:1.5}
  .qcard{background:#fff;border-radius:14px;padding:16px;box-shadow:0 1px 4px rgba(15,23,42,.08);margin-bottom:12px}
  .qhead{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--mut);margin-bottom:10px}
  .timer{background:#FEF3C7;color:#92400E;border-radius:8px;padding:3px 10px;font-weight:700;font-variant-numeric:tabular-nums}
  .timer.low{background:#FEE2E2;color:#991B1B}
  .qq{font-size:16px;line-height:1.5;margin-bottom:14px;white-space:pre-wrap}
  .opt{display:block;width:100%;text-align:left;border:1.5px solid #E2E8F0;border-radius:12px;background:#fff;padding:12px 14px;font-size:14.5px;margin-bottom:9px;cursor:pointer}
  .opt.picked{border-color:var(--g);background:#E8F5F1}
  .opt.right{border-color:#16A34A;background:#DCFCE7}
  .opt.wrong{border-color:#DC2626;background:#FEE2E2}
  .topic{display:inline-block;background:#E0F2FE;color:#075985;border-radius:8px;padding:2px 9px;font-size:11.5px;font-weight:600}
  .expl{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;margin-top:10px}
  .bar{height:8px;background:#E2E8F0;border-radius:6px;overflow:hidden;margin-bottom:14px}
  .bar i{display:block;height:100%;background:var(--g2);border-radius:6px;transition:width .3s}
  .score{font-size:42px;font-weight:800;color:var(--g);text-align:center}
  .yt{color:#075E46;font-weight:600;text-decoration:none;font-size:13.5px}
  .pill{display:inline-block;background:var(--g);color:#fff;border-radius:14px;padding:3px 12px;font-size:12px;font-weight:600}
  .nav{display:flex;gap:8px;justify-content:space-between;margin-top:6px}
  .nav .btn{margin-top:0;width:auto;flex:1;padding:11px 8px}
  .back{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;margin-bottom:8px}
</style>

 sel={c:null,ex:null,sub:null,q:[],i:0,answers:[],t:null,left:0,perq:45};
 h('<div class="card"><h2>1 \u00B7 Pick your country</h2><div class="chips">'+
   Object.keys(COUNTRY).map(function(c){return '<button class="chip" onclick="pickC(this.textContent)">'+c+'</button>';}).join("")+
   '</div><div class="note">Exams from Nigeria to India, USA to Kenya - and global tests. Pick your exam, pick a subject, and practice with a live countdown.</div></div><div id="step2"></div><div id="step3"></div>');
}
function pickC(c){sel.c=c;sel.ex=null;sel.sub=null;
 var d2=document.getElementById("step2");d2.innerHTML='<div class="card"><h2>2 \u00B7 Pick your exam</h2><div class="chips">'+
  COUNTRY[c].map(function(e){return '<button class="chip" onclick="pickEx(\''+e+'\')">'+bank(e).label+'</button>';}).join("")+'</div></div><div id="step3"></div>';
 window.scrollTo(0,document.body.scrollHeight);
}
function pickEx(e){sel.ex=e;sel.sub=null;
 var b=bank(e),subs=Object.keys(b.secs);
 document.getElementById("step3").innerHTML='<div class="card"><h2>3 \u00B7 Pick a subject \u2014 '+bank(e).label+'</h2>'+
  '<div class="chips">'+subs.map(function(s){return '<button class="chip" onclick="pickSub(\''+s.replace(/'/g,"\\'")+'\')">'+s+' \u00B7 '+b.secs[s].length+' questions</button>';}).join("")+'</div></div><div id="step4"></div>';
 window.scrollTo(0,document.body.scrollHeight);
}
function pickSub(s){sel.sub=s;
 var b=bank(sel.ex),topics=[];b.secs[s].forEach(function(q){if(topics.indexOf(q[4])<0)topics.push(q[4]);});
 document.getElementById("step4").innerHTML='<div class="card"><h2>'+b.label+' \u2014 '+s+'</h2>'+
  '<div style="margin-bottom:10px"><span class="pill">\uD83D\uDCF9 Free video lessons per topic</span></div>'+
  topics.map(function(t){return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F1F5F9"><span class="topic">'+t+'</span><a class="yt" target="_blank" rel="noopener" href="'+yt(sel.ex,s,t)+'">Watch lessons \u2197</a></div>';}).join("")+
  '<div class="note">Timed like the real CBT: 45 seconds per question. Explanations appear in your review after submission.</div>'+
  '<button class="btn g" onclick="startPractice(10)">\u25B6 Quick 10 (7.5 min)</button>'+
  '<button class="btn g" onclick="startPractice(0)">\u25B6 Full paper ('+b.secs[s].length+' questions)</button>';
 window.scrollTo(0,document.body.scrollHeight);
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startPractice(n){
 var b=bank(sel.ex),all=shuffle(b.secs[sel.sub]);
 sel.q=n>0?all.slice(0,Math.min(n,all.length)):all;
 sel.i=0;sel.answers=[];sel.left=sel.q.length*sel.perq;
 if(sel.t)clearInterval(sel.t);
 sel.t=setInterval(function(){sel.left--;var el=document.getElementById("tm");if(el){el.textContent=fmt(sel.left);if(sel.left<=30)el.className="timer low";}if(sel.left<=0)finish();},1000);
 renderQ();
}
function renderQ(){
 var q=sel.q[sel.i];
 h('<div class="qcard"><div class="qhead"><span>Question '+(sel.i+1)+' of '+sel.q.length+'</span><span class="timer" id="tm">'+fmt(sel.left)+'</span></div>'+
  '<div class="bar"><i style="width:'+Math.round(sel.i/sel.q.length*100)+'%"></i></div>'+
  '<div class="topic">'+q[4]+'</div><div class="qq">'+q[0]+'</div>'+
  q[1].split(",").map(function(o,k){return '<button class="opt" data-k="'+k+'" onclick="pick('+k+')">'+String.fromCharCode(65+k)+". "+o+'</button>';}).join("")+
  '<div class="nav"><button class="btn o" style="'+(sel.i===0?"visibility:hidden":"")+'" onclick="prev()">\u2190 Prev</button>'+
  '<button class="btn g" onclick="next()">'+(sel.i===sel.q.length-1?"Submit \u2713":"Next \u2192")+'</button></div>'+
  '<button class="btn o" style="margin-top:12px" onclick="if(confirm(\'Submit now?\'))finish()">End & submit</button></div>');
 if(sel.answers[sel.i]!==undefined){var b2=document.querySelectorAll(".opt")[sel.answers[sel.i]];if(b2)b2.className="opt picked";}
}
function pick(k){sel.answers[sel.i]=k;var os=document.querySelectorAll(".opt");for(var j=0;j<os.length;j++)os[j].className="opt";os[k].className="opt picked";}
function prev(){if(sel.i>0){sel.i--;renderQ();}}
function next(){if(sel.i<sel.q.length-1){sel.i++;renderQ();}else finish();}
function finish(){
 if(sel.t)clearInterval(sel.t);
 var right=0,rows="";
 for(var i=0;i<sel.q.length;i++){
  var q=sel.q[i],ok=sel.answers[i]===q[2];if(ok)right++;
  rows+='<div class="qcard"><div class="topic">'+q[4]+'</div><div class="qq">'+q[0]+'</div>'+
   q[1].split(",").map(function(o,k){return '<button class="opt '+(k===q[2]?"right":(sel.answers[i]===k?"wrong":""))+'" disabled>'+String.fromCharCode(65+k)+". "+o+'</button>';}).join("")+
   (ok?'<div class="expl">\u2705 Correct. '+q[3]+'</div>':'<div class="expl">'+(sel.answers[i]===undefined?"\u23F1 Not answered. ":"\u274C Incorrect. ")+'Correct answer: '+String.fromCharCode(65+q[2])+'. '+q[3]+'</div>')+
   '<a class="yt" style="display:block;margin-top:8px" target="_blank" rel="noopener" href="'+yt(sel.ex,sel.sub,q[4])+'">\uD83D\uDCF9 Revise this topic with free video lessons \u2197</a></div>';
 }
 var pct=sel.q.length?Math.round(right/sel.q.length*100):0;
 var msg=pct>=80?"Outstanding - you are exam ready! \uD83C\uDFC6":pct>=60?"Solid. Polish the topics you missed. \uD83D\uDCAA":"Keep going - read every explanation and retake. \uD83D\uDCDA";
 h('<div class="card" style="text-align:center"><div class="score">'+pct+'%</div><div style="color:var(--mut);margin-bottom:6px">'+right+' of '+sel.q.length+' correct \u00B7 '+bank(sel.ex).label+' \u00B7 '+sel.sub+'</div><div style="font-weight:600">'+msg+'</div>'+
  '<button class="btn g" onclick="home()">Choose another paper</button>'+
  '<button class="btn o" onclick="startPractice(0)">Retake</button></div>'+rows);
}
function goHome(){location.href="/app";}
home();
</script>
</body>
</html>
