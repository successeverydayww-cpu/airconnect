<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AirConnect · Exam Prep</title>
<style>
  :root{--g:#075E46;--g2:#25D366;--bg:#F0F2F5;--card:#fff;--ink:#1F2937;--mut:#64748B}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
  .top{background:linear-gradient(135deg,var(--g),#0C7C5A);color:#fff;padding:16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .top h1{margin:0;font-size:18px}
  .top .sub{font-size:11.5px;opacity:.85;margin-top:3px}
  .wrap{max-width:720px;margin:0 auto;padding:12px}
  .card{background:var(--card);border-radius:14px;padding:15px;margin-bottom:11px;box-shadow:0 1px 4px rgba(15,23,42,.08)}
  .card h2{margin:0 0 10px;font-size:14.5px;color:var(--g)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid #E2E8F0;background:#fff;color:var(--ink);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
  .chip.count{border-color:#BBF7D0;background:#F0FDF4}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:8px}
  .btn.g{background:var(--g2);color:#fff}
  .btn.o{background:#E2E8F0;color:#334155}
  .note{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.5}
  .qcard{background:#fff;border-radius:14px;padding:15px;box-shadow:0 1px 4px rgba(15,23,42,.08);margin-bottom:11px}
  .qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-bottom:9px}
  .timer{background:#FEF3C7;color:#92400E;border-radius:8px;padding:3px 10px;font-weight:700;font-variant-numeric:tabular-nums}
  .timer.low{background:#FEE2E2;color:#991B1B}
  .qq{font-size:15.5px;line-height:1.5;margin-bottom:13px;white-space:pre-wrap}
  .opt{display:block;width:100%;text-align:left;border:1.5px solid #E2E8F0;border-radius:12px;background:#fff;padding:11px 13px;font-size:14px;margin-bottom:8px;cursor:pointer}
  .opt.picked{border-color:var(--g);background:#E8F5F1}
  .opt.right{border-color:#16A34A;background:#DCFCE7}
  .opt.wrong{border-color:#DC2626;background:#FEE2E2}
  .topic{display:inline-block;background:#E0F2FE;color:#075985;border-radius:8px;padding:2px 9px;font-size:11.5px;font-weight:600;cursor:pointer;border:none}
  .expl{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.5;margin-top:9px}
  .bar{height:7px;background:#E2E8F0;border-radius:6px;overflow:hidden;margin-bottom:12px}
  .bar i{display:block;height:100%;background:var(--g2);border-radius:6px;transition:width .3s}
  .score{font-size:40px;font-weight:800;color:var(--g);text-align:center}
  .nav{display:flex;gap:8px;justify-content:space-between;margin-top:6px}
  .nav .btn{margin-top:0;width:auto;flex:1;padding:10px 8px}
  .back{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer;margin-bottom:7px}
  /* v2 in-app lesson player: video plays INSIDE the app, no redirect */
  .ovl{position:fixed;inset:0;background:rgba(2,6,23,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:10px}
  .ovl.hide{display:none}
  .vbox{width:100%;max-width:640px;background:#0B1220;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .vhead{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;color:#fff;font-size:13px;font-weight:600}
  .vclose{background:#334155;border:none;color:#fff;border-radius:8px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
  .vframe{width:100%;aspect-ratio:16/9;border:none;display:block;background:#000}
  .hint{font-size:11.5px;color:#94A3B8;padding:8px 12px;line-height:1.5}
</style>
</head>

var BANKS={"jamb":{"label":"JAMB UTME (Nigeria)","subs":{"English":[["Which word does NOT contain the same vowel sound as 'burn'?","heard|fern|heart|hurt",2,"'Heart' has the long vowel sound heard in 'car' while the others share the 'burn' vowel.","Pronunciation"],["In which word is 'ch' pronounced /k/?","chorus|chin|chirp|rich",0,"'Chorus' takes the /k/ sound as in 'school'.","Pronunciation"],["Which word contains a silent letter?","doubt|number|rabid|bubble",0,"The 'b' in 'doubt' is silent.","Pronunciation"],["'The POLICEMAN arrested the thief.' The capitalised stress answers the question:","Who arrested the thief?|Was the thief arrested?|What did the policeman do?|Why was the thief arrested?",0,"Emphatic stress on the doer answers the question 'who did it?'.","Stress and intonation"],["Which word rhymes with 'bough'?","cough|though|tough|dough",3,"'Dough' shares the 'ow' of 'bough'; the others differ.","Pronunciation"],["'To bell the cat' means to","provoke a quarrel|take a dangerous risk on behalf of others|refuse a challenge|keep secrets",1,"The idiom comes from the fable of mice putting a bell on the cat: doing the daring task.","Idioms"],["'A wild-goose chase' is a","furious argument|futile pursuit|hunting expedition|swift victory",1,"It is a hopeless quest that can never be caught.","Idioms"],["'To fight shy of' something is to","quarrel over it|avoid it|embrace it|postpone it forever",1,"To fight shy of is to keep away from, out of caution.","Idioms"],["'To eat one's words' is to","retract a statement|speak in riddles|gossip|speak too fast",0,"You publicly admit that what you said was wrong.","Idioms"],["'At daggers drawn' describes people who are","very tired|openly hostile|closely related|well matched",1,"Ready to fight: open enmity.","Idioms"],["'To make a clean breast of' something is to","boast about it|confess it fully|clean it up|forget it",1,"Full confession, holding nothing back.","Idioms"],["'To show the white feather' is to","display cowardice|signal surrender in war|show off|march proudly",0,"A white feather in a gamecock's tail marks a poor fighter, hence cowardice.","Idioms"],["'To take to one's heels' is to","run away|stand firm|apologise|dance",0,"To flee on foot.","Idioms"],["'Once in a blue moon' means","nightly|very rarely|monthly|at random",1,"A blue moon is rare; the phrase means very infrequently.","Idioms"],["'To play second fiddle' is to","take a subordinate role|play music badly|support a rival|lead from behind",0,"From the second violinist of an orchestra: to occupy an inferior position.","Idioms"],["The judge's 'censure' of the clerk means he","praised him|criticised him|promoted him|forgave him",1,"Censure is strong expressed disapproval.","Lexis in context"],["The antonym of 'malevolent' is","wicked|benevolent|malicious|crafty",1,"Malevolent means wishing evil; benevolent means wishing good.","Lexis in context"],["A completely 'innocuous' remark is one that is","insulting|harmless|confusing|hilarious",1,"Innocuous means causing no harm.","Lexis in context"],["An 'obdurate' man is","stubborn|humble|generous|hasty",0,"Obdurate means unyielding, hardened.","Lexis in context"],["The antonym of 'urbane' is","polished|awkward|wealthy|urban",1,"Urbane means suave and refined; the opposite is awkward or unsophisticated.","Lexis in context"],["Neither of the two boys ___ qualified for the final.","is|are|were|have",0,"'Neither' takes a singular verb.","Concord"],["The quality of the mangoes ___ not good.","is|are|were|have",0,"The subject is 'the quality', which is singular.","Concord"],["Mathematics ___ the language of the sciences.","is|are|were|have been",0,"Names of disciplines are singular.","Concord"],["You and I ___ the only witnesses to the accident.","am|is|are|was",2,"Two subjects joined by 'and' take a plural verb.","Concord"],["Hardly had he arrived ___ the lights went out.","than|when|that|before",1,"'Hardly ... when' is the correct correlating pair.","Concord"],["No sooner had we set out ___ it began to rain.","than|when|that|then",0,"'No sooner ... than' is the fixed pair.","Concord"],["If I ___ you, I would tender an apology.","am|was|were|be",2,"The subjunctive 'were' is used in hypothetical statements.","Concord"],["I'd rather you ___ that decision now.","don't make|didn't make|won't make|not make",1,"'Would rather' is followed by the past subjunctive.","Concord"],["He has been living in Kano ___ 2010.","for|since|from|before",1,"'Since' is used with a point in time in perfect tenses.","Tense and aspect"],["By this time next year, I ___ my degree.","will have completed|will complete|complete|would complete",0,"Future perfect marks completion before a stated future time.","Tense and aspect"],["He told us he ___ that film before.","had seen|has seen|saw|sees",0,"Reported speech of a past event earlier than the reporting verb takes past perfect.","Tense and aspect"],["Neither the principal nor the teachers ___ present at the assembly.","was|is|were|has been",2,"With 'neither ... nor', the verb agrees with the nearer subject, 'teachers'.","Concord"],["A pair of trousers ___ lying on the chair.","is|are|were|have been",0,"'Pair' is the headword, so the verb is singular.","Concord"],["The goods ___ stolen during the night.","was|were|is|has been",1,"'Goods' is a plural-only noun and takes a plural verb.","Concord"],["One should always be careful about ___ own conduct.","one's|ones|his|their",0,"The possessive of the pronoun 'one' is 'one's'.","Pronouns"],["Between you and ___, the plan will collapse.","I|me|myself|mine",1,"After a preposition, use the objective pronoun 'me'.","Pronouns"],["In 'I know that he is honest', the clause 'that he is honest' functions as the","object of the verb 'know'|adverbial of manner|qualifier of 'I'|complement of 'he'",0,"A noun clause following a transitive verb serves as its object.","Clauses"],["'What he said surprised everyone.' 'What he said' is a ___ clause.","noun|adverbial|adjectival|relative",0,"The whole clause acts as the subject of the sentence, hence a noun clause.","Clauses"],["The man WHO HELPED ME died last week. The capitalised part is a(n)","adverbial clause|relative clause|noun clause|main clause",1,"'Who helped me' qualifies 'the man', so it is an adjectival (relative) clause.","Clauses"],["The meeting was called ___ because of the sudden downpour.","off|out|up|over",0,"'Call off' means to cancel.","Phrasal verbs"],["She takes ___ her mother in both looks and temperament.","after|up|in|over",0,"'Take after' means to resemble a family member.","Phrasal verbs"],["The chairman could no longer put ___ with the constant insults.","up|off|out|down",0,"'Put up with' means to tolerate.","Phrasal verbs"],["The suspect was able to get ___ the charges for lack of evidence.","away with|along with|over with|out with",0,"'Get away with' means to escape punishment for.","Phrasal verbs"],["The teacher talked the boy ___ accepting the transfer.","into|over|with|by",0,"'Talk someone into' means to persuade them to do something.","Phrasal verbs"],["Which word is correctly spelt?","liason|liaison|liasone|liasson",1,"The correct spelling is 'liaison'.","Spelling"],["Which word is correctly spelt?","occurence|occurrence|ocurrence|occurrance",1,"'Occurrence' has double 'c', double 'r', ends with '-ence'.","Spelling"],["Which word is correctly spelt?","harass|harrass|haras|harress",0,"'Harass' has one 'r' and a double 's'.","Spelling"],["A lawyer's written statement that a document is being filed without conceding its legal effect begins 'without ___'.","precedent|precedence|prejudice|pretense",2,"The fixed legal phrase is 'without prejudice'.","Register"],["The new engineer is ______ for the fragile plant; he must handle it with care.","on trial|on duty|on parole|on guard",0,"'On trial' means being tested for suitability.","Phrasal usage"],["The doctor's prescription read 'two tablets ___ die'.","pro tem|per diem|in situ|per annum",1,"'Per diem' means per day.","Register"]],"Mathematics":[["Rationalise (√3 + √2) / (√3 − √2).","5 + 2√6|5 − 2√6|1 + 2√6|√6 − 5",0,"Multiply by conjugate: (5 + 2√6)/(3−2) = 5 + 2√6.","Surds"],["Solve 2^(2x+1) − 5(2^x) + 2 = 0. The sum of the values of x is","0|1|2|3",0,"Let y = 2^x: 2y² − 5y + 2 = 0, y = 2 or ½, so x = 1 or −1, sum 0.","Indices"],["Solve log₁₀x + log₁₀(x−3) = 1.","x = 5|x = 2|x = 5 and 2|x = 10",0,"x(x−3) = 10 → x² − 3x − 10 = 0 → x = 5 (x = −2 rejected).","Logarithms"],["If α and β are the roots of x² − 5x + 3 = 0, find α² + β².","25|22|19|13",2,"α+β = 5, αβ = 3, so α²+β² = 25 − 6 = 19.","Quadratic equations"],["Find the sum to infinity of 27 + 9 + 3 + ...","36|40.5|45|81",1,"S = a/(1−r) = 27/(1−⅓) = 27 × 3/2 = 40.5.","Sequences"],["The 7th term of the G.P. 2, 6, 18, ... is","486|1458|4374|729",1,"T₇ = 2 × 3⁶ = 2 × 729 = 1458.","Sequences"],["How many positive integers satisfy |x − 2| < 3?","3|4|5|6",1,"−1 < x < 5, so positive integers are 1, 2, 3, 4.","Inequalities"],["If tanθ = 3/4 and θ is acute, find sin 2θ.","12/25|24/25|7/25|6/25",1,"sin2θ = 2sinθcosθ = 2(3/5)(4/5) = 24/25.","Trigonometry"],["Find the area of a sector of radius 7 cm with angle π/2 radians. (π = 22/7)","38.5 cm²|77 cm²|19.25 cm²|154 cm²",0,"A = ½r²θ = ½ × 49 × π/2 = 49π/4 = 38.5 cm².","Mensuration"],["In how many ways can 5 people be seated round a circular table?","120|24|60|20",1,"Circular arrangements: (5−1)! = 24.","Permutations and combinations"],["A committee of 3 men and 2 women is chosen from 5 men and 4 women. How many committees are possible?","60|100|80|40",0,"C(5,3) × C(4,2) = 10 × 6 = 60.","Permutations and combinations"],["Two fair dice are thrown. What is the probability that the sum is 9?","1/6|4/36|1/9|5/36",2,"Favourable: (3,6),(4,5),(5,4),(6,3) = 4 of 36 = 1/9.","Probability"],["The mean of the first n natural numbers is 12.5. Find n.","24|25|23|26",0,"(n+1)/2 = 12.5 → n = 24.","Statistics"],["Find the median of 4, 7, 3, 9, 12, 15, 10.","9|10|7|12",0,"Sorted: 3,4,7,9,10,12,15 → middle value 9.","Statistics"],["Find the population variance of 2, 4, 6.","8/3|4|2|√8",0,"Mean 4; deviations −2,0,2; variance = (4+0+4)/3 = 8/3.","Statistics"],["If f(x) = x² − 3x + 2, then f(x+1) equals","x² − x|x² + x|x² − 5x + 6|x² − 2x",0,"Substitute: (x+1)² − 3(x+1) + 2 = x² − x.","Functions"],["Solve the pair x + y = 5 and x² − y² = 5.","x = 3, y = 2|x = 2, y = 3|x = 4, y = 1|x = 1, y = 4",0,"x−y = 1; with x+y = 5, x = 3, y = 2.","Simultaneous equations"],["Find the gradient of the line perpendicular to 2x + 3y = 6.","−2/3|3/2|2/3|−3/2",1,"Line slope −2/3; perpendicular gradient is the negative reciprocal, 3/2.","Coordinate geometry"],["Find the distance between the points (2, 3) and (5, 7).","4|5|√7|√13",1,"d = √(9+16) = 5.","Coordinate geometry"],["State the radius of the circle (x − 2)² + (y + 1)² = 9.","3|9|6|2",0,"Standard form gives r² = 9, so r = 3.","Coordinate geometry"],["Find the remainder when x³ + 2x² − 5x + 1 is divided by x − 2.","7|−7|1|5",0,"Remainder theorem: f(2) = 8 + 8 − 10 + 1 = 7.","Polynomials"],["If (x + 1) is a factor of x³ + kx + 2, find k.","1|−1|2|−3",0,"f(−1) = −1 − k + 2 = 0 → k = 1.","Polynomials"],["If 24 in base x equals 18 in base ten, find x.","6|7|8|9",1,"2x + 4 = 18 → x = 7.","Number bases"],["If y varies jointly as x and z, and y = 12 when x = 3 and z = 2, find y when x = 4 and z = 5.","40|30|45|36",0,"y = kxz, k = 2, so y = 2 × 4 × 5 = 40.","Variation"],["Evaluate log₂(log₃81).","2|4|3|1",0,"log₃81 = 4, then log₂4 = 2.","Logarithms"],["Given log₁₀2 = 0.3010, the number of digits in 2⁵⁰ is","15|16|14|17",1,"50 × 0.3010 = 15.05 → 16 digits.","Logarithms"],["Simplify (125/27)^(−1/3).","3/5|5/3|−5/3|15/27",0,"(125/27)^(1/3) = 5/3, then reciprocal = 3/5.","Indices"],["A regular polygon has the sum of its interior angles equal to 1080°. How many sides has it?","6|7|8|9",2,"(n−2)180 = 1080 → n = 8.","Geometry"],["Each interior angle of a regular hexagon measures","60°|120°|135°|108°",1,"(6−2)180/6 = 120°.","Geometry"],["In triangle ABC, angle A = 60°, A ic|military rule",1,"No paramount kings: councils and age grades governed.","Early Nigerian societies"],["The trans-Atlantic slave trade depopulated West Africa chiefly by","exporting captives across the ocean|settling colonists|building schools|importing cloth",0,"Millions were shipped to the Americas.","Slave trade"],["British abolition of the slave trade (1807) was driven by","industrial needs, economics and humanitarian pressure|lack of ships|African kings' petitions|weather",0,"Industry wanted raw materials and markets; voices condemned slavery.","Slave trade"],["Lagos was annexed by Britain in 1861 chiefly to","stop the slave trade and secure trade routes|build a university|grow cocoa|mine gold",0,"King Dosunmu ceded Lagos under treaty pressure.","Colonial rule"],["The Berlin Conference of 1884–85 established the principle of","effective occupation|indirect rule|free education|war reparations",0,"Powers had to occupy and administer to claim territory.","Colonial rule"],["The Royal Niger Company under George Goldie held a royal charter from","1861|1886|1900|1914",1,"Chartered in 1886 to administer the lower Niger.","Colonial rule"],["In 1900 the Royal Niger Company's territories were transferred to the British government for","£865,000|£86,500|£8,650,000|£1,000",0,"The company sold its charter territories.","Colonial rule"],["The Oil Rivers Protectorate was renamed in 1893 as the","Colony of Lagos|Niger Coast Protectorate|Southern Nigeria|Gold Coast",1,"It became the Niger Coast Protectorate.","Colonial rule"],["Indirect rule worked well in Northern Nigeria because","the British built schools first|existing emirate institutions were used|the north had no rulers|chiefs were elected",1,"Emirs retained authority under British supervision.","Colonial rule"],["Indirect rule failed in Igbo country mainly because","the Igbo were absent|no central traditional chiefs existed to mediate|the British refused to appoint anyone|the people welcomed warrant chiefs as kings",1, amples and implications|answer yes or no only|repeat the question",1,"Part 3 rewards developed argument.","Speaking"],["Which shows grammatical range?","I went. I see. I will go.|Having lived abroad, I have grown used to different cuisines.|I go shop and I go home and I go sleep.|It was good, it was nice, it was fine.",1,"Complex structures demonstrate range.","Grammar"],["Choose the correct sentence.","There is many reasons.|There are many reasons for this trend.|Their is many reasons.|There many reasons are.",1,"Plural subject needs 'are'.","Grammar"],["Choose correctly: 'The number of people ___ increasing.'","are|is|were|have",1,"'The number of' is singular.","Grammar"],["Choose the articles: 'He is ___ engineer at ___ university.'","an / a|a / an|an / an|a / a",0,"'Engineer' takes an; 'university' takes a.","Grammar"],["Choose: 'By 2020, she ___ here for ten years.'","works|had worked|is working|work",1,"Past perfect for duration before a past point.","Grammar"],["Choose: 'Neither the manager nor the staff ___ ready.'","was|were|is|has",1,"Agreement follows the nearer plural subject.","Grammar"],["A body-paragraph topic sentence should","ask a question|state the paragraph's main point|quote the examiner|apologise",1,"Each paragraph opens with its point.","Writing"],["Which linking phrase signals contrast?","In addition|On the other hand|For instance|To conclude",1,"'On the other hand' contrasts.","Cohesion"],["Which phrase signals an example?","However|For example|Consequently|Conversely",1,"'For example' introduces an illustration.","Cohesion"],["The best Task 2 conclusion","repeats the introduction verbatim|restates the position in fresh wording|adds a brand-new argument|ends with a question to the reader",1,"Conclusions restate, not restart.","Writing"],["If you hear 'to rent' as the answer, you write","to rent|to renting|renting|rent to",0,"Write exactly the words heard that fit the gap.","Listening"],["Before writing Task 1, first","count all words|analyse var COUNTRY={
"Nigeria":["jamb","waec","neco","bece"],
"Ghana":["waec","bece","ielts","toefl"],
"Kenya":["kcse","ielts","toefl"],
"South Africa":["nsc","ielts","toefl"],
"USA":["satu","act","toefl"],
"UK":["gcse","ielts","toefl"],
"India":["jee","neet","ielts"],
"Global":["ielts","toefl","satu","gcse","kcse","jamb","waec","jee","neet","nsc","act","neco","bece"]
};
/* ===== Exam Prep engine v2 (skylar, 24 Sep 2026) =====
   50-question timed CBT papers, hard-mode bank, in-app video lessons (no YouTube redirect),
   randomized draw + answer-position shuffle so every retake looks different. */
var sel={c:null,ex:null,sub:null,pool:[],q:[],i:0,answers:[],perms:[],t:null,left:0,perq:45};
var R=document.getElementById("root");
function h(s){R.innerHTML=s;window.scrollTo(0,0);}
function fmt(sec){var m=Math.floor(sec/60),s2=sec%60;return m+":"+String(s2).padStart(2,"0");}
function bank(ex){var d=BANKS[ex];return d.same?BANKS[d.same]:d;}
function subs(ex){var b=bank(ex);var s=b.subs||{};return s;}
function resolveRef(ref){var p=ref.split(".");return (BANKS[p[0]].same?BANKS[BANKS[p[0]].same]:BANKS[p[0]]).subs[p[1]];}
function poolFor(ex,sub){var b=bank(ex);var v=b.subs[sub];if(typeof v==="string")return resolveRef(v);return v;}
function ytQ(ex,sub,topic){return bank(ex).label.split(" (")[0]+" "+sub+" "+topic+" full lesson";}
/* ---------- in-app player (embedded, never a redirect) ---------- */
function playTopic(topic){
  var q=ytQ(sel.ex,sel.sub,topic);
  document.getElementById("vtitle").textContent=topic+" — "+sel.sub;
  document.getElementById("vframe").src="https://www.youtube-nocookie.com/embed?listType=search&list="+encodeURIComponent(q)+"&autoplay=1";
  document.getElementById("vwrap").className="ovl";
}
function closeVid(){var f=document.getElementById("vframe");f.src="";document.getElementById("vwrap").className="ovl hide";}
/* ---------- flow ---------- */
function home(){
 closeVid();if(sel.t)clearInterval(sel.t);
 sel={c:null,ex:null,sub:null,pool:[],q:[],i:0,answers:[],perms:[],t:null,left:0,perq:45};
 h('<div class="card"><h2>1 · Pick your country</h2><div class="chips">'+
   Object.keys(COUNTRY).map(function(c){return '<button class="chip" onclick="pickC(this.textContent)">'+c+'</button>';}).join("")+
   '</div><div class="note">Every paper is 50 hard questions with a live countdown, full explanations on review, and topic lessons that play inside the app.</div></div><div id="step2"></div><div id="step3"></div>');
}
function pickC(c){sel.c=c;sel.ex=null;sel.sub=null;
 document.getElementById("step2").innerHTML='<div class="card"><h2>2 · Pick your exam</h2><div class="chips">'+
  COUNTRY[c].map(function(e){return '<button class="chip" onclick="pickEx(\''+e+'\')">'+bank(e).label+'</button>';}).join("")+'</div></div><div id="step3"></div>';
 window.scrollTo(0,document.body.scrollHeight);
}
function pickEx(e){sel.ex=e;sel.sub=null;
 var s=subs(e),names=Object.keys(s);
 document.getElementById("step3").innerHTML='<div class="card"><h2>3 · Pick a subject — '+bank(e).label+'</h2>'+
  '<div class="chips">'+names.map(function(n){var p=poolFor(e,n);return '<button class="chip" onclick="pickSub(\''+n.replace(/'/g,"\\'")+'\')">'+n+' · '+(p?p.length:0)+' q</button>';}).join("")+'</div></div><div id="step4"></div>';
 window.scrollTo(0,document.body.scrollHeight);
}
function pickSub(s){
 sel.sub=s;var pool=poolFor(sel.ex,s);sel.pool=pool;
 var topics=[];(pool||[]).forEach(function(q){if(topics.indexOf(q[4])<0)topics.push(q[4]);});
 document.getElementById("step4").innerHTML='<div class="card"><h2>'+bank(sel.ex).label+' — '+s+'</h2>'+
  '<div style="font-size:12.5px;color:var(--mut);margin-bottom:9px">📺 Tap any topic below — the lesson plays right here in the app.</div>'+
  '<div class="chips">'+topics.map(function(t){return '<button class="chip count" onclick="playTopic(this.textContent)">▶ '+t+'</button>';}).join("")+'</div>'+
  '<div class="note">'+(pool?pool.length:0)+' hard questions in this bank. The paper draws 50 (or the whole bank) at random, with answers reshuffled every attempt — retakes always look different.</div>'+
  '<button class="btn g" onclick="startPractice(50)">▶ Start 50-question CBT ('+Math.round(50*sel.perq/60)+' min)</button>'+
  '<button class="btn o" onclick="startPractice(20)">▶ Quick 20 practice</button>';
 window.scrollTo(0,document.body.scrollHeight);
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startPractice(n){
 closeVid();
 var all=shuffle(sel.pool||[]);
 sel.q=all.slice(0,Math.min(n,all.length));
 sel.i=0;sel.answers=[];sel.perms=[];
 for(var k=0;k<sel.q.length;k++){sel.perms.push(shuffle([0,1,2,3]));sel.answers.push(undefined);}
 sel.left=sel.q.length*sel.perq;
 if(sel.t)clearInterval(sel.t);
 sel.t=setInterval(function(){sel.left--;var el=document.getElementById("tm");if(el){el.textContent=fmt(sel.left);if(sel.left<=30)el.className="timer low";}if(sel.left<=0)finish();},1000);
 renderQ();
}
function opts(q,perm){var o=String(q[1]).split("|");return perm.map(function(i){return o[i];});}
function renderQ(){
 var q=sel.q[sel.i],perm=sel.perms[sel.i],os=opts(q,perm);
 h('<div class="qcard"><div class="qhead"><span>Question '+(sel.i+1)+' of '+sel.q.length+'</span><span class="timer" id="tm">'+fmt(sel.left)+'</span></div>'+
  '<div class="bar"><i style="width:'+Math.round(sel.i/sel.q.length*100)+'%"></i></div>'+
  '<button class="topic" onclick="playTopic(this.textContent)">'+q[4]+'</button><div class="qq">'+q[0]+'</div>'+
  os.map(function(o,k){return '<button class="opt" onclick="pick('+k+')">'+String.fromCharCode(65+k)+". "+o+'</button>';}).join("")+
  '<div class="nav"><button class="btn o" style="'+(sel.i===0?"visibility:hidden":"")+'" onclick="prev()">← Prev</button>'+
  '<button class="btn g" onclick="next()">'+(sel.i===sel.q.length-1?"Submit ✓":"Next →")+'</button></div>'+
  '<button class="btn o" style="margin-top:10px" onclick="if(confirm(\'Submit now?\'))finish()">End & submit</button></div>');
 if(sel.answers[sel.i]!==undefined){var b2=document.querySelectorAll(".opt")[sel.answers[sel.i]];if(b2)b2.className="opt picked";}
}
function pick(k){sel.answers[sel.i]=k;var os=document.querySelectorAll(".opt");for(var j=0;j<os.length;j++)os[j].className="opt";if(os[k])os[k].className="opt picked";}
function prev(){if(sel.i>0){sel.i--;renderQ();}}
function next(){if(sel.i<sel.q.length-1){sel.i++;renderQ();}else finish();}
function finish(){
 if(sel.t)clearInterval(sel.t);closeVid();
 var right=0,rows="";
 for(var i=0;i<sel.q.length;i++){
  var q=sel.q[i],perm=sel.perms[i],ans=sel.answers[i];
  var shown=perm.indexOf(q[2]); /* bank answer index mapped to displayed position */
  var ok=ans===shown;if(ok)right++;
  rows+='<div class="qcard"><button class="topic" onclick="playTopic(this.textContent)">'+q[4]+'</button><div class="qq">'+q[0]+'</div>'+
   opts(q,perm).map(function(o,k){return '<button class="opt '+(k===shown?"right":(ans===k?"wrong":""))+'" disabled>'+String.fromCharCode(65+k)+". "+o+'</button>';}).join("")+
   (ok?'<div class="expl">✅ Correct. '+q[3]+'</div>':'<div class="expl">'+(ans===undefined?"⏱ Not answered. ":"❌ Incorrect. ")+'Correct answer: '+String.fromCharCode(65+shown)+". "+q[3]+'</div>')+
   '<button class="topic" style="margin-top:8px" onclick="playTopic(this.textContent)">📺 Revise: '+q[4]+'</button></div>';
 }
 var pct=sel.q.length?Math.round(right/sel.q.length*100):0;
 var msg=pct>=80?"Elite zone — you are exam ready. 🏆":pct>=60?"Strong. Hunt down every topic you missed. 💪":"No retreat — read each explanation and run it again. 📚";
 h('<div class="card" style="text-align:center"><div class="score">'+pct+'%</div><div style="color:var(--mut);margin-bottom:5px">'+right+' of '+sel.q.length+' correct · '+bank(sel.ex).label+' · '+sel.sub+'</div><div style="font-weight:600">'+msg+'</div>'+
  '<button class="btn g" onclick="startPractice(50)">↻ Retake (new random paper)</button>'+
  '<button class="btn o" onclick="home()">Choose another paper</button></div>'+rows);
}
function goHome(){location.href="/app";}
home();

</script>
</body>
</html>
