<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AirConnect · Exam Prep</title>
<style>
  :root{--g:#075E46;--g2:#25D366;--bg:#F0F2F5;--card:#fff;--ink:#1F2937;--mut:#64748B}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:80px}
  .top{background:linear-gradient(135deg,var(--g),#0C7C5A);color:#fff;padding:16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .top h1{margin:0;font-size:18px}
  .top .sub{font-size:11.5px;opacity:.85;margin-top:3px}
  .wrap{max-width:720px;margin:0 auto;padding:12px}
  .card{background:var(--card);border-radius:14px;padding:15px;margin-bottom:11px;box-shadow:0 1px 4px rgba(15,23,42,.08)}
  .card h2{margin:0 0 10px;font-size:14.5px;color:var(--g)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid #E2E8F0;background:#fff;color:var(--ink);border-radius:20px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
  .chip.count{border-color:#BBF7D0;background:#F0FDF4}
  .btn{display:block;width:100%;border:none;border-radius:12px;padding:12px;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:8px}
  .btn.g{background:var(--g2);color:#fff}
  .btn.o{background:#E2E8F0;color:#334155}
  .note{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.5}
  .qcard{background:#fff;border-radius:14px;padding:15px;box-shadow:0 1px 4px rgba(15,23,42,.08);margin-bottom:11px}
  .qhead{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-bottom:9px}
  .timer{background:#FEF3C7;color:#92400E;border-radius:8px;padding:3px 10px;font-weight:700;font-variant-numeric:tabular-nums}
  .timer.low{background:#FEE2E2;color:#991B1B}
  .qq{font-size:15.5px;line-height:1.5;margin-bottom:13px;white-space:pre-wrap}
  .opt{display:block;width:100%;text-align:left;border:1.5px solid #E2E8F0;border-radius:12px;background:#fff;padding:11px 13px;font-size:14px;margin-bottom:8px;cursor:pointer}
  .opt.picked{border-color:var(--g);background:#E8F5F1}
  .opt.right{border-color:#16A34A;background:#DCFCE7}
  .opt.wrong{border-color:#DC2626;background:#FEE2E2}
  .topic{display:inline-block;background:#E0F2FE;color:#075985;border-radius:8px;padding:2px 9px;font-size:11.5px;font-weight:600;cursor:pointer;border:none}
  .expl{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.5;margin-top:9px}
  .bar{height:7px;background:#E2E8F0;border-radius:6px;overflow:hidden;margin-bottom:12px}
  .bar i{display:block;height:100%;background:var(--g2);border-radius:6px;transition:width .3s}
  .score{font-size:40px;font-weight:800;color:var(--g);text-align:center}
  .nav{display:flex;gap:8px;justify-content:space-between;margin-top:6px}
  .nav .btn{margin-top:0;width:auto;flex:1;padding:10px 8px}
  .back{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:8px;padding:5px 11px;font-size:12.5px;cursor:pointer;margin-bottom:7px}
  /* v2 in-app lesson player: video plays INSIDE the app, no redirect */
  .ovl{position:fixed;inset:0;background:rgba(2,6,23,.82);z-index:50;display:flex;align-items:center;justify-content:center;padding:10px}
  .ovl.hide{display:none}
  .vbox{width:100%;max-width:640px;background:#0B1220;border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .vhead{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;color:#fff;font-size:13px;font-weight:600}
  .vclose{background:#334155;border:none;color:#fff;border-radius:8px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
  .vframe{width:100%;aspect-ratio:16/9;border:none;display:block;background:#000}
  .dq{background:#fff;border:1.5px solid #E2E8F0;border-radius:12px;padding:10px;margin:10px 0;text-align:center;overflow-x:auto}
  .dq svg{max-width:100%;height:auto}
  .hint{font-size:11.5px;color:#94A3B8;padding:8px 12px;line-height:1.5}
</style>
</head>

var BANKS={"jamb":{"label":"JAMB UTME (Nigeria)","subs":{"English":[["Which word does NOT contain the same vowel sound as 'burn'?","heard|fern|heart|hurt",2,"'Heart' has the long vowel sound heard in 'car' while the others share the 'burn' vowel.","Pronunciation"],["In which word is 'ch' pronounced /k/?","chorus|chin|chirp|rich",0,"'Chorus' takes the /k/ sound as in 'school'.","Pronunciation"],["Which word contains a silent letter?","doubt|number|rabid|bubble",0,"The 'b' in 'doubt' is silent.","Pronunciation"],["'The POLICEMAN arrested the thief.' The capitalised stress answers the question:","Who arrested the thief?|Was the thief arrested?|What did the policeman do?|Why was the thief arrested?",0,"Emphatic stress on the doer answers the question 'who did it?'.","Stress and intonation"],["Which word rhymes with 'bough'?","cough|though|tough|dough",3,"'Dough' shares the 'ow' of 'bough'; the others differ.","Pronunciation"],["'To bell the cat' means to","provoke a quarrel|take a dangerous risk on behalf of others|refuse a challenge|keep secrets",1,"The idiom comes from the fable of mice putting a bell on the cat: doing the daring task.","Idioms"],["'A wild-goose chase' is a","furious argument|futile pursuit|hunting expedition|swift victory",1,"It is a hopeless quest that can never be caught.","Idioms"],["'To fight shy of' something is to","quarrel over it|avoid it|embrace it|postpone it forever",1,"To fight shy of is to keep away from, out of caution.","Idioms"],["'To eat one's words' is to","retract a statement|speak in riddles|gossip|speak too fast",0,"You publicly admit that what you said was wrong.","Idioms"],["'At daggers drawn' describes people who are","very tired|openly hostile|closely related|well matched",1,"Ready to fight: open enmity.","Idioms"],["'To make a clean breast of' something is to","boast about it|confess it fully|clean it up|forget it",1,"Full confession, holding nothing back.","Idioms"],["'To show the white feather' is to","display cowardice|signal surrender in war|show off|march proudly",0,"A white feather in a gamecock's tail marks a poor fighter, hence cowardice.","Idioms"],["'To take to one's heels' is to","run away|stand firm|apologise|dance",0,"To flee on foot.","Idioms"],["'Once in a blue moon' means","nightly|very rarely|monthly|at random",1,"A blue moon is rare; the phrase means very infrequently.","Idioms"],["'To play second fiddle' is to","take a subordinate role|play music badly|support a rival|lead from behind",0,"From the second violinist of an orchestra: to occupy an inferior position.","Idioms"],["The judge's 'censure' of the clerk means he","praised him|criticised him|promoted him|forgave him",1,"Censure is strong expressed disapproval.","Lexis in context"],["The antonym of 'malevolent' is","wicked|benevolent|malicious|crafty",1,"Malevolent means wishing evil; benevolent means wishing good.","Lexis in context"],["A completely 'innocuous' remark is one that is","insulting|harmless|confusing|hilarious",1,"Innocuous means causing no harm.","Lexis in context"],["An 'obdurate' man is","stubborn|humble|generous|hasty",0,"Obdurate means unyielding, hardened.","Lexis in context"],["The antonym of 'urbane' is","polished|awkward|wealthy|urban",1,"Urbane means suave and refined; the opposite is awkward or unsophisticated.","Lexis in context"],["Neither of the two boys ___ qualified for the final.","is|are|were|have",0,"'Neither' takes a singular verb.","Concord"],["The quality of the mangoes ___ not good.","is|are|were|have",0,"The subject is 'the quality', which is singular.","Concord"],["Mathematics ___ the language of the sciences.","is|are|were|have been",0,"Names of disciplines are singular.","Concord"],["You and I ___ the only witnesses to the accident.","am|is|are|was",2,"Two subjects joined by 'and' take a plural verb.","Concord"],["Hardly had he arrived ___ the lights went out.","than|when|that|before",1,"'Hardly ... when' is the correct correlating pair.","Concord"],["No sooner had we set out ___ it began to rain.","than|when|that|then",0,"'No sooner ... than' is the fixed pair.","Concord"],["If I ___ you, I would tender an apology.","am|was|were|be",2,"The subjunctive 'were' is used in hypothetical statements.","Concord"],["I'd rather you ___ that decision now.","don't make|didn't make|won't make|not make",1,"'Would rather' is followed by the past subjunctive.","Concord"],["He has been living in Kano ___ 2010.","for|since|from|before",1,"'Since' is used with a point in time in perfect tenses.","Tense and aspect"],["By this time next year, I ___ my degree.","will have completed|will complete|complete|would complete",0,"Future perfect marks completion before a stated future time.","Tense and aspect"],["He told us he ___ that film before.","had seen|has seen|saw|sees",0,"Reported speech of a past event earlier than the reporting verb takes past perfect.","Tense and aspect"],["Neither the principal nor the teachers ___ present at the assembly.","was|is|were|has been",2,"With 'neither ... nor', the verb agrees with the nearer subject, 'teachers'.","Concord"],["A pair of trousers ___ lying on the chair.","is|are|were|have been",0,"'Pair' is the headword, so the verb is singular.","Concord"],["The goods ___ stolen during the night.","was|were|is|has been",1,"'Goods' is a plural-only noun and takes a plural verb.","Concord"],["One should always be careful about ___ own conduct.","one's|ones|his|their",0,"The possessive of the pronoun 'one' is 'one's'.","Pronouns"],["Between you and ___, the plan will collapse.","I|me|myself|mine",1,"After a preposition, use the objective pronoun 'me'.","Pronouns"],["In 'I know that he is honest', the clause 'that he is honest' functions as the","object of the verb 'know'|adverbial of manner|qualifier of 'I'|complement of 'he'",0,"A noun clause following a transitive verb serves as its object.","Clauses"],["'What he said surprised everyone.' 'What he said' is a ___ clause.","noun|adverbial|adjectival|relative",0,"The whole clause acts as the subject of the sentence, hence a noun clause.","Clauses"],["The man WHO HELPED ME died last week. The capitalised part is a(n)","adverbial clause|relative clause|noun clause|main clause",1,"'Who helped me' qualifies 'the man', so it is an adjectival (relative) clause.","Clauses"],["The meeting was called ___ because of the sudden downpour.","off|out|up|over",0,"'Call off' means to cancel.","Phrasal verbs"],["She takes ___ her mother in both looks and temperament.","after|up|in|over",0,"'Take after' means to resemble a family member.","Phrasal verbs"],["The chairman could no longer put ___ with the constant insults.","up|off|out|down",0,"'Put up with' means to tolerate.","Phrasal verbs"],["The suspect was able to get ___ the charges for lack of evidence.","away with|along with|over with|out with",0,"'Get away with' means to escape punishment for.","Phrasal verbs"],["The teacher talked the boy ___ accepting the transfer.","into|over|with|by",0,"'Talk someone into' means to persuade them to do something.","Phrasal verbs"],["Which word is correctly spelt?","liason|liaison|liasone|liasson",1,"The correct spelling is 'liaison'.","Spelling"],["Which word is correctly spelt?","occurence|occurrence|ocurrence|occurrance",1,"'Occurrence' has double 'c', double 'r', ends with '-ence'.","Spelling"],["Which word is correctly spelt?","harass|harrass|haras|harress",0,"'Harass' has one 'r' and a double 's'.","Spelling"],["A lawyer's written statement that a document is being filed without conceding its legal effect begins 'without ___'.","precedent|precedence|prejudice|pretense",2,"The fixed legal phrase is 'without prejudice'.","Register"],["The new engineer is ______ for the fragile plant; he must handle it with care.","on trial|on duty|on parole|on guard",0,"'On trial' means being tested for suitability.","Phrasal usage"],["The doctor's prescription read 'two tablets ___ die'.","pro tem|per diem|in situ|per annum",1,"'Per diem' means per day.","Register"]],"Mathematics":[["Rationalise (√3 + √2) / (√3 − √2).","5 + 2√6|5 − 2√6|1 + 2√6|√6 − 5",0,"Multiply by conjugate: (5 + 2√6)/(3−2) = 5 + 2√6.","Surds",""],["Solve 2^(2x+1) − 5(2^x) + 2 = 0. The sum of the values of x is","0|1|2|3",0,"Let y = 2^x: 2y² − 5y + 2 = 0, y = 2 or ½, so x = 1 or −1, sum 0.","Indices",""],["Solve log₁₀x + log₁₀(x−3) = 1.","x = 5|x = 2|x = 5 and 2|x = 10",0,"x(x−3) = 10 → x² − 3x − 10 = 0 → x = 5 (x = −2 rejected).","Logarithms",""],["If α and β are the roots of x² − 5x + 3 = 0, find α² + β².","25|22|19|13",2,"α+β = 5, αβ = 3, so α²+β² = 25 − 6 = 19.","Quadratic equations",""],["Find the sum to infinity of 27 + 9 + 3 + ...","36|40.5|45|81",1,"S = a/(1−r) = 27/(1−⅓) = 27 × 3/2 = 40.5.","Sequences",""],["The 7th term of the G.P. 2, 6, 18, ... is","486|1458|4374|729",1,"T₇ = 2 × 3⁶ = 2 × 729 = 1458.","Sequences",""],["How many positive integers satisfy |x − 2| < 3?","3|4|5|6",1,"−1 < x < 5, so positive integers are 1, 2, 3, 4.","Inequalities",""],["If tanθ = 3/4 and θ is acute, find sin 2θ.","12/25|24/25|7/25|6/25",1,"sin2θ = 2sinθcosθ = 2(3/5)(4/5) = 24/25.","Trigonometry",""],["Find the area of a sector of radius 7 cm with angle π/2 radians. (π = 22/7)","38.5 cm²|77 cm²|19.25 cm²|154 cm²",0,"A = ½r²θ = ½ × 49 × π/2 = 49π/4 = 38.5 cm².","Mensuration",""],["In how many ways can 5 people be seated round a circular table?","120|24|60|20",1,"Circular arrangements: (5−1)! = 24.","Permutations and combinations",""],["A committee of 3 men and 2 women is chosen from 5 men and 4 women. How many committees are possible?","60|100|80|40",0,"C(5,3) × C(4,2) = 10 × 6 = 60.","Permutations and combinations",""],["Two fair dice are thrown. What is the probability that the sum is 9?","1/6|4/36|1/9|5/36",2,"Favourable: (3,6),(4,5),(5,4),(6,3) = 4 of 36 = 1/9.","Probability",""],["The mean of the first n natural numbers is 12.5. Find n.","24|25|23|26",0,"(n+1)/2 = 12.5 → n = 24.","Statistics",""],["Find the median of 4, 7, 3, 9, 12, 15, 10.","9|10|7|12",0,"Sorted: 3,4,7,9,10,12,15 → middle value 9.","Statistics",""],["Find the population variance of 2, 4, 6.","8/3|4|2|√8",0,"Mean 4; deviations −2,0,2; variance = (4+0+4)/3 = 8/3.","Statistics",""],["If f(x) = x² − 3x + 2, then f(x+1) equals","x² − x|x² + x|x² − 5x + 6|x² − 2x",0,"Substitute: (x+1)² − 3(x+1) + 2 = x² − x.","Functions",""],["Solve the pair x + y = 5 and x² − y² = 5.","x = 3, y = 2|x = 2, y = 3|x = 4, y = 1|x = 1, y = 4",0,"x−y = 1; with x+y = 5, x = 3, y = 2.","Simultaneous equations",""],["Find the gradient of the line perpendicular to 2x + 3y = 6.","−2/3|3/2|2/3|−3/2",1,"Line slope −2/3; perpendicular gradient is the negative reciprocal, 3/2.","Coordinate geometry",""],["Find the distance between the points (2, 3) and (5, 7).","4|5|√7|√13",1,"d = √(9+16) = 5.","Coordinate geometry",""],["State the radius of the circle (x − 2)² + (y + 1)² = 9.","3|9|6|2",0,"Standard form gives r² = 9, so r = 3.","Coordinate geometry",""],["Find the remainder when x³ + 2x² − 5x + 1 is divided by x − 2.","7|−7|1|5",0,"Remainder theorem: f(2) = 8 + 8 − 10 + 1 = 7.","Polynomials",""],["If (x + 1) is a factor of x³ + kx + 2, find k.","1|−1|2|−3",0,"f(−1) = −1 − k + 2 = 0 → k = 1.","Polynomials",""],["If 24 in base x equals 18 in base ten, find x.","6|7|8|9",1,"2x + 4 = 18 → x = 7.","Number bases",""],["If y varies jointly as x and z, and y = 12 when x = 3 and z = 2, find y when x = 4 and z = 5.","40|30|45|36",0,"y = kxz, k = 2, so y = 2 × 4 × 5 = 40.","Variation",""],["Evaluate log₂(log₃81).","2|4|3|1",0,"log₃81 = 4, then log₂4 = 2.","Logarithms",""],["Given log₁₀2 = 0.3010, the number of digits in 2⁵⁰ is","15|16|14|17",1,"50 × 0.3010 = 15.05 → 16 digits.","Logarithms",""],["Simplify (125/27)^(−1/3).","3/5|5/3|−5/3|15/27",0,"(125/27)^(1/3) = 5/3, then reciprocal = 3/5.","Indices",""],["A regular polygon has the sum of its interior angles equal to 1080°. How many sides has it?","6|7|8|9",2,"(n−2)180 = 1080 → n = 8.","Geometry",""],["Each interior angle of a regular hexagon measures","60°|120°|135°|108°",1,"(6−2)180/6 = 120°.","Geometry",""],["In triangle ABC, angle A = 60°, AB = 8 cm, AC = 6 cm. Find BC.","2√13|√52 cannot be|10|4√3",0,"Cosine rule: BC² = 64+36−2(8)(6)cos60° = 52 → BC = 2√13.","Trigonometry",""],["Find the height of an equilateral triangle of side 6 cm.","3√3|6√3|3|6",0,"Height = (√3/2) × 6 = 3√3.","Mensuration",""],["Find the volume of a cylinder of radius 7 cm and height 10 cm. (π = 22/7)","1540 cm³|770 cm³|154 cm³|3080 cm³",0,"V = πr²h = (22/7)(49)(10) = 1540.","Mensuration",""],["A cone has slant height 10 cm and base radius 6 cm. Find its vertical height.","8 cm|4 cm|16 cm|√136 cm",0,"h = √(100 − 36) = 8.","Mensuration",""],["Find the total surface area of a hemisphere of radius 7 cm. (π = 22/7)","462 cm²|308 cm²|154 cm²|616 cm²",0,"3πr² = 3 × (22/7) × 49 = 462.","Mensuration",""],["The angle of elevation of the top of a tower 40 m tall is 30° from a point on level ground. Find the distance of the point from the foot.","40√3 m|40 m|20√3 m|80 m",0,"tan30° = 40/d → d = 40√3.","Bearings and elevation",""],["The bearing of B from A is 060°. Find the bearing of A from B.","240°|120°|300°|060°",0,"Back bearing = 60° + 180° = 240°.","Bearings and elevation",""],["Find the determinant of the matrix [[2,3],[1,4]].","5|8|11|−5",0,"ad − bc = 8 − 3 = 5.","Matrices",""],["If A = [[1,2],[0,1]], find A².","[[1,4],[0,1]]|[[2,4],[0,2]]|[[1,2],[0,1]]|[[1,4],[0,2]]",0,"Multiply A by itself: [[1,4],[0,1]].","Matrices",""],["A binary operation is defined by a * b = ab + a. Evaluate 2 * 3.","8|6|11|12",0,"2 × 3 + 2 = 8.","Binary operations",""],["Find the sum of the first 15 odd numbers.","225|240|196|256",0,"Sum of first n odd numbers = n² = 225.","Sequences",""],["The 3rd term of a G.P. is 12 and the common ratio is 2. Find the 6th term.","96|48|192|24",0,"ar² = 12 → a = 3; T₆ = 3 × 2⁵ = 96.","Sequences",""],["Find the 20th term of the A.P. 5, 8, 11, ...","59|62|65|68",1,"T₂₀ = 5 + 19×3 = 62.","Sequences",""],["An article bought for ₦2,500 is sold for ₦3,000. Find the percentage profit.","25%|20%|17%|30%",1,"Profit 500 on cost 2500 = 20%.","Commercial arithmetic",""],["Find the simple interest on ₦8,000 for 3 years at 5% per annum.","₦1,200|₦800|₦1,500|₦2,400",0,"I = PRT/100 = 8000×5×3/100 = 1200.","Commercial arithmetic",""],["Find the compound interest on ₦10,000 for 2 years at 10% per annum.","₦2,100|₦2,000|₦1,900|₦2,310",0,"Amount = 10000(1.1)² = 12,100 → interest 2,100.","Commercial arithmetic",""],["₦2,400 is shared between two men in the ratio 3:5. Find the smaller share.","₦900|₦1,200|₦1,500|₦800",0,"Smaller = 3/8 × 2400 = 900.","Commercial arithmetic",""],["Find the least integer satisfying 2x − 3 ≥ 7.","4|5|6|7",1,"x ≥ 5, so the least integer is 5.","Inequalities",""],["Evaluate √0.0081.","0.09|0.9|0.009|9",0,"√0.0081 = 0.09 since 0.09² = 0.0081.","Surds",""],["Find the next term of the sequence 2, 5, 10, 17, 26, ...","35|37|33|39",1,"Pattern n² + 1: 6² + 1 = 37.","Sequences",""],["Given that f(x) = 2x − 3 and g(x) = x² + 1, find fg(2).","7|6|11|2",0,"g(2) = 5, f(5) = 7.","Functions",""],["In the circle, PT is a tangent at T and TAB is a chord. The angle between the tangent and the chord, ∠PTA = 35°. The angle in the alternate segment, ∠TAB, is","35°|55°|70°|45°",0,"The alternate segment theorem: the angle between tangent and chord equals the angle in the opposite arc, so ∠TAB = 35°.","Circle Theorems","<svg viewBox=\"0 0 240 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:240px\"><circle cx=\"120\" cy=\"85\" r=\"60\" fill=\"none\" stroke=\"#475569\" stroke-width=\"2\"/><line x1=\"30\" y1=\"85\" x2=\"210\" y2=\"85\" stroke=\"#25D366\" stroke-width=\"2.5\"/><text x=\"18\" y=\"80\" font-size=\"10\" fill=\"#334155\">P</text><circle cx=\"180\" cy=\"85\" r=\"2.5\" fill=\"#334155\"/><text x=\"176\" y=\"76\" font-size=\"10\" fill=\"#334155\">T</text><line x1=\"180\" y1=\"85\" x2=\"120\" y2=\"35\" stroke=\"#B45309\" stroke-width=\"2\"/><line x1=\"180\" y1=\"85\" x2=\"95\" y2=\"125\" stroke=\"#B45 =\"10\" fill=\"#334155\">Y</text><circle cx=\"110\" cy=\"110\" r=\"3\" fill=\"#334155\"/><text x=\"112\" y=\"126\" font-size=\"10\" fill=\"#334155\">Z</text><line x1=\"40\" y1=\"110\" x2=\"75\" y2=\"75\" stroke=\"#B45309\" stroke-width=\"2\"/><line x1=\"75\" y1=\"75\" x2=\"110\" y2=\"110\" stroke=\"#25D366\" stroke-width=\"2\" stroke-dasharray=\"4\"/><path d=\"M46 106 A14 14 0 0 1 52 96\" fill=\"none\" stroke=\"#DC2626\" stroke-width=\"1.5\"/><text x=\"56\" y=\"103\" font-size=\"9\" fill=\"#DC2626\">45°</text></svg>"],["The Venn diagram shows a class of 40 students: 12 study only A, 10 study only B, 6 study both, the rest study neither. The probability that a student chosen at random studies A or B is","0.7|0.3|0.6|0.4",0,"n(A∪B) = 12+10+6 = 28; P = 28/40 = 0.7.","Probability","<svg viewBox=\"0 0 240 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:240px\"><rect x=\"20\" y=\"15\" width=\"200\" height=\"110\" fill=\"none\" stroke=\"#475569\" stroke-width=\"2\"/><circle cx=\"85\" cy=\"70\" r=\"38\" fill=\"none\" stroke=\"#B45309\" stroke-width=\"2\"/><circle cx=\"145\" cy=\"70\" r=\"38\" fill=\"none\" stroke=\"#25D366\" stroke-width=\"2\"/><text x=\"52\" y=\"75\" font-size=\"12\" fill=\"#334155\">12</text><text x=\"115\" y=\"75\" font-size=\"12\" fill=\"#334155\">6</text><text x=\"168\" y=\"75\" font-size=\"12\" fill=\"#334155\">10</text><text x=\"185\" y=\"115\" font-size=\"12\" fill=\"#334155\">12</text><text x=\"62\" y=\"40\" font-size=\"12\" fill=\"#B45309\">A</text><text x=\"152\" y=\"40\" font-size=\"12\" fill=\"#25D366\">B</text></svg>"],["The parabola y = x² − 4x + 3 is shown with its intercepts marked. The coordinates of its minimum point are","(2, −1)|(2, 1)|(−2, −1)|(1, −1)",0,"y = (x−2)² − 1, so the minimum is at (2, −1).","Quadratic Graphs","<svg viewBox=\"0 0 240 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:240px\"><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"130\" stroke=\"#94A3B8\" stroke-width=\"1.5\"/><line x1=\"20\" y1=\"95\" x2=\"230\" y2=\"95\" stroke=\"#94A3B8\" stroke-width=\"1.5\"/><path d=\"M50 15 Q120 175 190 15\" fill=\"none\" stroke=\"#25D366\" stroke-width=\"2.5\"/><circle cx=\"78\" cy=\"95\" r=\"3\" fill=\"#DC2626\"/><circle cx=\"162\" cy=\"95\" r=\"3\" fill=\"#DC2626\"/><text x=\"66\" y=\"88\" font-size=\"9\" fill=\"#334155\">1</text><text x=\"160\" y=\"88\" font-size=\"9\" fill=\"#334155\">3</text><text x=\"26\" y=\"92\" font-size=\"9\" fill=\"#334155\">0</text><text x=\"112\" y=\"132\" font-size=\"9\" fill=\"#64748B\">x</text><text x=\"34\" y=\"20\" font-size=\"9\" fill=\"#64748B\">y</text></svg>"]],"Physics":[["A body starts from rest and accelerates uniformly at 4 m/s². Find its velocity after covering 50 m.","20 m/s|16 m/s|25 m/s|12.5 m/s",0,"v² = u² + 2as = 0 + 2(4)(50) = 400 → v = 20.","Motion",""],["The range of a projectile is maximum when the angle of projection is","30°|45°|60°|90°",1,"R = u²sin2θ/g is maximum when sin2θ = 1, i.e. θ = 45°.","Motion",""],["A man in a lift accelerating upward at a m/s² experiences an apparent weight of","m(g−a)|m(g+a)|mg|zero",1,"R − mg = ma → R = m(g + a).","Newton's laws",""],["The escape velocity from the Earth's surface is approximately","7.9 km/s|11.2 km/s|5.0 km/s|16.7 km/s",1,"About 11.2 km/s is needed to escape Earth's gravity.","Gravitation",""],["The acceleration due to gravity at height h above the Earth's surface (h << R) is approximately","g(1 − 2h/R)|g(1 − h/R)|g(1 + 2h/R)|g(1 + h/R)",0,"gh = GM/(R+h)² ≈ g(1 − 2h/R) for small h.","Gravitation",""],["A geostationary satellite has a period of","12 hours|24 hours|365 days|one lunar month",1,"It appears fixed, so it rotates with Earth's 24-hour period.","Gravitation",""],["The Young modulus of a material is the ratio of","stress to strain|force to extension|mass to weight|work to time",0,"Young modulus = tensile stress/tensile strain, in N/m².","Elasticity",""],["A spring of natural length 20 cm extends by 4 cm under a load of 2 N. Find the force constant.","0.5 N/cm|8 N/cm|0.5 N/m|50 N/m",0,"k = F/e = 2/4 = 0.5 N/cm.","Elasticity",""],["The work done in stretching a spring of constant k to extension e is","ke|½ke|½ke²|ke²",2,"Work = average force × extension = ½ke².","Energy",""],["A machine of efficiency 80% receives 500 J of input energy. The useful output is","500 J|400 J|625 J|80 J",1,"Output = 0.8 × 500 = 400 J.","Energy",""],["Find the heat needed to raise 2 kg of water by 5°C. (c = 4200 J/kgK)","42,000 J|4,200 J|8,400 J|21,000 J",0,"Q = mcΔθ = 2 × 4200 × 5 = 42,000 J.","Heat",""],["Calculate the heat required to melt 0.5 kg of ice at 0°C. (L = 3.34 × 10⁵ J/kg)","1.67 × 10⁵ J|3.34 × 10⁵ J|8.35 × 10⁴ J|6.68 × 10⁵ J",0,"Q = mL = 0.5 × 3.34 × 10⁵ = 1.67 × 10⁵ J.","Heat",""],["At constant pressure, the volume of a fixed mass of gas is directly proportional to its absolute temperature. This is","Boyle's law|Charles' law|Gay-Lussac's law|Dalton's law",1,"That is Charles' law.","Gas laws",""],["A gas occupies 300 cm³ at 100 kPa. Find its volume at 150 kPa, temperature constant.","450 cm³|200 cm³|150 cm³|250 cm³",1,"Boyle: V₂ = 100×300/150 = 200 cm³.","Gas laws",""],["Heat transfer that requires no material medium is","conduction|convection|radiation|evaporation",2,"Radiation travels through a vacuum.","Heat",""],["A wave has frequency 50 Hz and wavelength 4 m. Find its speed.","200 m/s|12.5 m/s|54 m/s|100 m/s",0,"v = fλ = 50 × 4 = 200.","Waves",""],["The period of a wave of frequency 50 Hz is","0.02 s|0.2 s|50 s|2 s",0,"T = 1/f = 0.02 s.","Waves",""],["The fundamental wavelength of a sound in an OPEN pipe of length L is","L|2L|4L|L/2",1,"Open pipe fundamental: λ = 2L.","Waves",""],["In a CLOSED pipe, the frequency of the third overtone is","3f|5f|7f|2f",2,"Closed pipes give odd harmonics: f, 3f, 5f, 7f; the third overtone is 7f.","Waves",""],["The apparent frequency of a source moving towards a listener is","lower than the source frequency|higher than the source frequency|equal|zero",1,"Doppler effect: approaching source raises the apparent pitch.","Waves",""],["The critical angle C for a medium of refractive index n is given by","sin C = n|sin C = 1/n|tan C = 1/n|cos C = n",1,"At critical angle, sin C = 1/n.","Optics",""],["An object is placed 30 cm from a converging lens of focal length 10 cm. Find the image distance.","15 cm|−15 cm|7.5 cm|30 cm",0,"1/f = 1/u + 1/v → 1/10 − 1/30 = 1/30, v = 15 cm.","Optics",""],["The magnification of the image in question 22 is","2|0.5|3|1.5",1,"m = v/u = 15/30 = 0.5.","Optics",""],["In the dispersion of white light by a prism, the colour deviated MOST is","red|violet|green|yellow",1,"Violet has the shortest wavelength and deviates most.","Optics",""],["Two sources producing a stable interference pattern must be","incoherent|coherent|in phase always|unpolarised",1,"Interference requires coherent sources with a constant phase difference.","Optics",""],["The spreading of waves around the edges of an obstacle is","refraction|diffraction|reflection|polarisation",1,"Diffraction is the bending and spreading of waves at edges.","Waves",""],["In the photoelectric effect, no electrons are emitted when the incident light frequency is","above the threshold|below the threshold|exactly at threshold|any frequency",1,"Below the threshold frequency the photon energy is insufficient, no matter the intensity.","Quantum physics",""],["The maximum kinetic energy of photoelectrons equals","hf|Φ|hf − Φ|hf + Φ",2,"KE(max) = hf − Φ where Φ is the work function.","Quantum physics",""],["The equation E = mc² expresses the equivalence of","mass and velocity|energy and mass|charge and mass|force and energy",1,"Mass-energy equivalence from Einstein's special relativity.","Nuclear physics",""],["An alpha particle is identical with","a proton|a helium nucleus|an electron|a hydrogen atom",1,"An alpha particle is a helium nucleus: 2 protons + 2 neutrons.","Nuclear physics",""],["Gamma rays are","electrons|electromagnetic waves|helium nuclei|neutrons",1,"Gamma rays are high-energy electromagnetic radiation.","Nuclear physics",""],["A radioactive isotope has a half-life of 8 hours. The time taken for the activity to fall to 1/16 of its original value is","16 h|24 h|32 h|40 h",2,"1/16 = four half-lives = 32 hours.","Nuclear physics",""],["Commercial nuclear reactors obtain energy from","nuclear fusion|nuclear fission of U-235|chemical combustion|alpha decay",1,"Reactors use controlled fission of uranium-235.","Nuclear physics",""],["If 12 C of charge passes a point in 4 s, the current is","3 A|48 A|0.33 A|8 A",0,"I = Q/t = 12/4 = 3 A.","Current electricity",""],["Resistors of 3 Ω and 6 Ω are connected in parallel. The equivalent resistance is","2 Ω|9 Ω|18 Ω|4.5 Ω",0,"1/R = 1/3 + 1/6 = 1/2 → R = 2 Ω.","Current electricity",""],["The resistivity ρ of a material of resistance R, length L and cross-sectional area A is","RL/A|RA/L|R/A L|R L A",0,"R = ρL/A → ρ = RA/L.","Current electricity",""],["A cell of emf 12 V and internal resistance 0.5 Ω drives a current of 2 A. The external resistance is","5.5 Ω|6 Ω|6.5 Ω|5 Ω",0,"E = I(R + r) → 12 = 2(R + 0.5) → R = 5.5 Ω.","Current electricity",""],["Find the power dissipated in a 3 Ω resistor carrying 2 A.","12 W|6 W|1.5 W|24 W",0,"P = I²R = 4 × 3 = 12 W.","Current electricity",""],["The commercial unit of electrical energy is the","watt|kilowatt-hour|joule|volt",1,"Electricity is sold in kilowatt-hours (units).","Current electricity",""],["The balance condition of a Wheatstone bridge requires","P = Q|R = S|P/Q = R/S|P R = Q S",2,"At balance, the ratios of the arms are equal: P/Q = R/S.","Current electricity",""],["The force on a current-carrying conductor in a magnetic field is","BIL sinθ|BIL cosθ|B/IL|B I / L",0,"F = BIL sinθ, maximum when the conductor is perpendicular to the field.","Electromagnetism",""],["Fleming's left-hand rule is used to find the direction of force on a","moving charge in an electric field|current-carrying conductor in a magnetic field|induced current|a falling magnet",1,"It relates field, current and force (motor effect).","Electromagnetism",""],["The direction of an induced current is such as to oppose the change producing it. This is","Faraday's law|Lenz's law|Ohm's law|Ampere's law",1,"Lenz's law: induced effects oppose their cause.","Electromagnetism",""],["In an ideal step-up transformer, if the voltage rises 10 times, the current","rises 10 times|falls to one tenth|stays constant|doubles",1,"Power is conserved: voltage up, current down.","Electromagnetism",""],["The part of a d.c. generator that keeps the current flowing one way is the","slip ring|commutator|brush|armature",1,"The split-ring commutator reverses connections each half turn.","Electromagnetism",""],["Cathode rays are streams of","protons|electrons|neutrons|X-rays",1,"Cathode rays are fast-moving electrons.","Atomic physics",""],["X-rays are produced when","slow neutrons hit a target|fast electrons strike a metal target|alpha particles hit paper|light strikes a photocell",1,"Sudden deceleration of fast electrons in a metal target emits X-rays.","Atomic physics",""],["Which logic gate is universal, being able to build all others?","AND|OR|NOT|NAND",3,"NAND (and NOR) can combine to form every other gate.","Electronics",""],["Doping pure silicon with a pentavalent impurity produces","p-type|n-type|intrinsic|insulating",1,"Five valence electrons leave a free electron: n-type.","Electronics",""],["A transformer is rated 240 V to 12 V. If the primary has 2000 turns, the secondary has","100 turns|200 turns|40,000 turns|500 turns",0,"Ns/Np = Vs/Vp → Ns = 2000 × 12/240 = 100.","Electromagnetism",""],["The simple pendulum shown has period T at length L. If the length is increased to 4L (same planet), the new period is","2T|4T|T/2|8T",0,"T = 2π√(L/g). With 4L: T' = 2π√(4L/g) = 2·2π√(L/g) = 2T.","Simple Pendulum","<svg viewBox=\"0 0 240 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:240px\"><line x1=\"20\" y1=\"15\" x2=\"20\" y2=\"95\" stroke=\"#475569\" stroke-width=\"2\"/><circle ""],["In PV = nRT, if P is in atmospheres and V in dm³, then R equals","8.31 J/K|0.082 atm·dm³/K|1.987 cal/K|62.4 L·mmHg/K",1,"R = 0.0821 atm dm³ K⁻¹ mol⁻¹ with those units.","Gas laws",""],["For N₂ + 3H₂ ⇌ 2NH₃, the equilibrium constant Kc equals","[NH₃]²/[N₂][H₂]³|[NH₃]² × [N₂][H₂]³|[N₂][H₂]³/[NH₃]²|2[NH₃]/[N₂]3[H₂]",0,"Products over reactants with stoichiometric powers.","Chemical equilibrium",""],["Increasing the pressure in the Haber process N₂ + 3H₂ ⇌ 2NH₃ shifts equilibrium","to the left|to the right|no shift|depends on catalyst",1,"Fewer gas moles on the right; pressure favours the right.","Chemical equilibrium",""],["Raising the temperature of an equilibrium mixture shifts the position towards","the exothermic direction|the endothermic direction|no direction|the side with more moles only",1,"Heat is treated as a reactant for endothermic directions.","Chemical equilibrium",""],["A catalyst added to a system at equilibrium","increases the yield|speeds attainment without changing the position|shifts it right|slows the reverse reaction",1,"Catalysts affect rate both ways, not the position.","Chemical equilibrium",""],["The pH of a 0.01 M hydrochloric acid solution is","1|2|12|0.01",1,"[H⁺] = 0.01 → pH = −log(10⁻²) = 2.","Acids and bases",""],["At 25°C, the ionic product of water Kw equals","10⁻⁷|10⁻¹⁴|10⁻¹⁰|1",1,"Kw = [H⁺][OH⁻] = 1 × 10⁻¹⁴.","Acids and bases",""],["The suitable indicator for a strong acid–strong base titration is","methyl orange only|phenolphthalein|litmus only|none",1,"Endpoint near pH 7; phenolphthalein (range 8.3–10) is standard.","Acids and bases",""],["A buffer solution can be prepared from a","strong acid and its salt|weak acid and its salt|strong base alone|any salt",1,"Weak acid + conjugate salt resists pH change.","Acids and bases",""],["The oxidation number of chromium in K₂Cr₂O₇ is","+3|+6|+7|+2",1,"2(+1) + 2x + 7(−2) = 0 → x = +6.","Redox reactions",""],["The oxidation number of manganese in KMnO₄ is","+7|+6|+5|+4",0,"+1 + x + 4(−2) = 0 → x = +7.","Redox reactions",""],["Oxidation is defined as the","gain of electrons|loss of electrons|gain of protons|loss of neutrons",1,"OIL RIG: oxidation is loss of electrons.","Redox reactions",""],["Zinc displaces copper from copper(II) solution because zinc is","more reactive|heavier|cheaper|a better conductor",0,"Higher metals in the reactivity series displace lower ones.","Redox reactions",""],["During electrolysis, reduction occurs at the","anode|cathode|both electrodes|neither electrode",1,"Cathode: cations gain electrons (reduction).","Electrolysis",""],["What mass of copper is deposited by 9,650 C? (Cu²⁺, eq. mass 31.75, F = 96,500 C)","31.75 g|3.175 g|63.5 g|1.59 g",1,"m = (Q/F) × eq. mass = 0.1 × 31.75 = 3.175 g.","Electrolysis",""],["In the electrolytic refining of copper, the anode is made of","pure copper|impure copper|carbon|platinum",1,"Impure copper dissolves at the anode; pure deposits at the cathode.","Electrolysis",""],["The bleaching action of chlorine water is due to the release of","hydrogen|nascent oxygen|chloride ions|ozone",1,"Cl₂ + H₂O → HCl + HOCl; HOCl releases nascent oxygen that bleaches.","Descriptive chemistry",""],["Hydrogen sulphide gas turns lead acetate paper","white|black|blue|green",1,"Pb²⁺ + H₂S → black PbS.","Descriptive chemistry",""],["Carbon dioxide turns limewater milky because it forms","CaCl₂|CaCO₃|Ca(OH)₂|CaSO₄",1,"The white precipitate is calcium carbonate.","Descriptive chemistry",""],["Ammonia is manufactured industrially by the","Ostwald process|Haber process|Contact process|Solvay process",1,"N₂ + 3H₂ → 2NH₃ under high pressure with an iron catalyst.","Industrial chemistry",""],["Nitric acid is manufactured by the","Haber process|Ostwald process|Contact process|Dow process",1,"Ostwald: ammonia oxidised over platinum to NO then HNO₃.","Industrial chemistry",""],["Sulphuric acid is manufactured by the","Contact process|Haber process|Ostwald process|Hall process",0,"SO₂ oxidised to SO₃ over V₂O₅ at about 450°C.","Industrial chemistry",""],["Ethene reacts with steam in the presence of H₃PO₄ catalyst to give","ethanol|ethanal|ethanoic acid|ethane",0,"Hydration of ethene → ethanol.","Organic chemistry",""],["Ethanol heated with ethanoic acid and a little H₂SO₄ gives","an ester|an ether|an alkene|a soap",0,"Esterification: ethyl ethanoate + water.","Organic chemistry",""],["The alkaline hydrolysis of fats and oils produces soap and","ethanol|glycerol|glucose|ammonia",1,"Saponification yields soap + glycerol.","Organic chemistry",""],["How many structural isomers has C₄H₁₀?","1|2|3|4",1,"n-butane and 2-methylpropane only.","Organic chemistry",""],["The general molecular formula of the alkanes is","CnH2n|CnH2n+2|CnH2n−2|CnHn",1,"Saturated chain: CnH2n+2.","Organic chemistry",""],["In the addition of HBr to propene, the hydrogen attaches to the carbon with","fewer hydrogens|more hydrogens|any carbon|the middle carbon",1,"Markovnikov's rule: H goes to the carbon already richer in hydrogen.","Organic chemistry",""],["The triple bond present in ethyne makes it suitable for","cooking|welding|painting|fertilising",1,"Ethyne (acetylene) burns very hot — oxy-acetylene welding.","Organic chemistry",""],["Polyethene is formed from ethene by","addition polymerisation|condensation polymerisation|substitution|fermentation",0,"Many ethene monomers add to one another.","Organic chemistry",""],["Benzene undergoes mainly","addition reactions|substitution reactions|combustion only|no reaction",1,"Its delocalised ring prefers substitution, preserving stability.","Organic chemistry",""],["The oxidation of a primary alkanol gives first","an alkanoic acid|an alkanal|a ketone|an ester",1,"Primary alkanol → alkanal (aldehyde) → alkanoic acid.","Organic chemistry",""],["The IUPAC name of CH₃CH(CH₃)CH₂CH₃ is","2-methylbutane|3-methylbutane|butane|dimethylpropane",0,"Longest chain 4; methyl group on carbon 2.","Organic chemistry",""],["The electron configuration of chlorine (Z = 17) is","2,8,7|2,8,8|2,7,8|8,2,7",0,"Shell filling gives 2,8,7.","Atomic structure",""],["The electron configuration of the Fe²⁺ ion (Fe = 2,8,14,2) is","2,8,14|2,8,12,2|2,8,16|2,8,13,2",0,"Atoms lose 4s electrons first: 2,8,14.","Atomic structure",""],["Isotopes of an element have identical chemical properties because they have the same","number of neutrons|number of protons and electrons|mass number|density",1,"Chemistry is decided by electron/proton arrangement.","Atomic structure",""],["Across a period, the atomic radius","increases|decreases|stays constant|fluctuates randomly",1,"Nuclear charge rises and pulls electrons closer.","Periodic table",""],["The elements with the highest first ionisation energy in each period are the","alkali metals|halogens|noble gases|transition metals",2,"Full outer shells make electron removal hardest.","Periodic table",""],["The abnormally high boiling point of water is due to","hydrogen bonding|ionic bonding|covalent size|heavy oxygen",0,"Extensive hydrogen bonds need extra energy to break.","Bonding",""],["Group 1 metals are stored under oil because they","oxidise rapidly in air and react with water|are radioactive|smell strongly|melt easily",0,"Na and K react violently with air and water; oil excludes both.","Descriptive chemistry",""],["Hardness in water is caused mainly by the ions of","Na⁺ and K⁺|Ca²⁺ and Mg²⁺|Fe³⁺ and Al³⁺|NH₄⁺ and H⁺",1,"Calcium and magnesium salts cause hardness.","Descriptive chemistry",""],["In the titration set-up, 25.0 cm³ of dilute HCl is titrated against 0.100 mol/dm³ NaOH; the mean titre is 20.00 cm³. The concentration of the acid is","0.080 mol/dm³|0.100 mol/dm³|0.125 mol/dm³|0.050 mol/dm³",0,"n(NaOH)=0.100×0.0200=0.00200 mol; 1:1 ratio; c(HCl)=0.00200/0.0250=0.080 mol/dm³.","Acid-Base Titration","<svg viewBox=\"0 0 240 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:240px\"><rect x=\"95\" y=\"15\" width=\"18\" height=\"60\" fill=\"#DBEAFE\" stroke=\"#334155\"/><rect x=\"90\" y=\"12\" width=\"28\" height=\ y falls proportionally more than the price rises.","Elasticity",""],["Demand for salt is highly inelastic because it is","a luxury|a necessity with many uses|expensive|fashionable",1,"Necessities have inelastic demand.","Elasticity",""],["A rise in the cost of production shifts the supply curve","rightward|leftward|nowhere|downward along itself",1,"Higher costs reduce supply at every price.","Supply",""],["A surplus occurs when price is","below equilibrium|above equilibrium|at equilibrium|falling",1,"Above equilibrium, quantity supplied exceeds quantity demanded.","Price determination",""],["Cross elasticity of demand between two substitute goods is","negative|positive|zero|infinite",1,"Substitutes: demand for one rises when the other's price rises.","Elasticity",""],["For an inferior good, income elasticity of demand is","positive|negative|zero|always above 1",1,"As income rises, demand falls.","Elasticity",""],["Consumer equilibrium occurs where","MUa = MUb|MUa/Pa = MUb/Pb|total utility = 0|price = cost",1,"Equal marginal utility per naira spent.","Utility",""],["Indifference curves cannot intersect because that would imply","identical goods|inconsistent preferences|rising utility|zero income",1,"Intersection gives two different utility levels for one bundle.","Utility",""],["The law of diminishing returns operates only in the","long run|short run with at least one fixed factor|market period|planning horizon only",1,"Short run: some factors are fixed.","Production",""],["As output increases, average fixed cost","rises|falls|stays constant|falls then rises",1,"Fixed cost is spread over more units.","Cost theory",""],["Marginal cost cuts average cost at the","maximum of AC|minimum of AC|zero point|rising part only",1,"MC = AC where AC is at its lowest.","Cost theory",""],["Internal economies of scale cause the long-run average cost to","rise|fall|stay flat|become vertical",1,"Scale economies lower LRAC.","Cost theory",""],["In the long run under perfect competition,  of trade|variable cost",1,"How often money changes hands.","Money",""],["A reserve ratio of 20% gives a money multiplier of","2|5|10|20",1,"1/0.2 = 5.","Banking",""],["The central bank's role as 'lender of last resort' means it lends to","commercial banks in distress|private individuals|foreign firms|the stock exchange",0,"It supports banks facing runs.","Banking",""],["Open market operations involve the central bank","selling and buying securities|printing notes|fixing wages|nationalising banks",0,"Trading securities changes money supply.","Banking",""],["Fiscal policy is managed through","money supply and interest rates|government spending and taxation|exchange rates|tariffs only",1,"Budget instruments.","Public finance",""],["A progressive tax is one whose rate","is constant|rises as income rises|falls as income rises|is paid only by firms",1,"Higher incomes pay higher rates.","Public finance",""],["A budget surplus means","revenue exceeds expenditure|expenditure exceeds revenue|both are equal|taxes fall",0,"Government saves the difference.","Public finance",""],["The current account of the balance of payments records","capital flows only|goods, services and transfers|gold movements only|foreign aid only",1,"Trade in goods/services plus income and transfers.","International trade",""],["Balance of trade is the difference between","visible exports and imports|all exports and imports|money in and out|goods and services plus capital",0,"Visible (merchandise) trade only.","International trade",""],["Terms of trade are calculated as","export index ÷ import index × 100|imports ÷ exports|exports − imports|trade balance ÷ GDP",0,"It measures export purchasing power.","International trade",""],["The country with the LOWER opportunity cost in producing a good has","absolute advantage|comparative advantage|no advantage|negative advantage",1,"Comparative advantage is relative opportunity cost.","International trade",""],["Tariffs on imports primarily aim to","punish consume n Enterprises Promotion Decrees promoted","foreign control|indigenous ownership|state monopoly|free imports",1,"Indigenisation transferred business to Nigerians.","Nigerian economy",""],["The money market deals in funds that are","short-term|long-term|foreign only|non-existent",0,"Short-term instruments like treasury bills.","Financial institutions",""],["The stock exchange is primarily a ___ market for securities.","primary|secondary|foreign|retail",1,"Existing shares are traded among investors.","Financial institutions",""],["The precautionary motive for holding money is to","speculate|meet unexpected needs|pay taxes only|earn interest",1,"It buffers against emergencies.","Money",""],["The diagram shows the demand curve shifting from D to D₁ (rightwards) for a normal good. This shift is best explained by","a rise in consumers' income|a fall in the price of the good itself|a rise in production costs|an increase in indirect taxation",0,"A rightward shift of the whole demand curve means more is demanded at every price — for a normal good, higher income does that. A change in the good's own price moves ALONG the curve, not the curve.","Demand and Supply","<svg viewBox=\"0 0 240 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:240px\"><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"130\" stroke=\"#94A3B8\" stroke-width=\"1.5\"/><line x1=\"20\" y1=\"120\" x2=\"230\" y2=\"120\" stroke=\"#94A3B8\" stroke-width=\"1.5\"/><line x1=\"60\" y1=\"25\" x2=\"180\" y2=\"115\" stroke=\"#334155\" stroke-width=\"2\"/><line x1=\"110\" y1=\"25\" x2=\"230\" y2=\"115\" stroke=\"#25D366\" stroke-width=\"2\"/><text x=\"45\" y=\"35\" font-size=\"11\" fill=\"#334155\">D</text><text x=\"102\" y=\"35\" font-size=\"11\" fill=\"#25D366\">D₁</text><text x=\"12\" y=\"20\" font-size=\"10\" fill=\"#334155\">P</text><text x=\"220\" y=\"133\" font-size=\"10\" fill=\"#334155\">Q</text></svg>"],["In the production possibility curve shown, point A lies inside the curve, B lies ON the curve and C lies outside it. Which points are currently attainable?","A and B only|B and C only|A and C only|C only",0,"Points on or inside the PPC are attainable (B efficiently, A with unemployment); C is beyond current resources.","Production Possibility Curve","<svg viewBox=\"0 0 240 150\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:240px\"><line x1=\"30\" y1=\"10\" x2=\"30\" y2=\"130\" stroke=\"#94A3B8\" stroke-width=\"1.5\"/><line x1=\"20\" y1=\"120\" x2=\"230\" y2=\"120\" stroke=\"#94A3B8\" stroke-width=\"1.5\"/><path d=\"M40 115 Q40 20 210 115\" fill=\"none\" stroke=\"#475569\" stroke-width=\"2.5\"/><circle cx=\"70\" cy=\"100\" r=\"4\" fill=\"#DC2626\"/><text x=\"66\" y=\"112\" font-size=\"11\" fill=\"#334155\">A</text><circle cx=\"105\" cy=\"62\" r=\"4\" fill=\"#25D366\"/><text x=\"112\" y=\"60\" font-size=\"11\" fill=\"#334155\">B</text><circle cx=\"85\" cy=\"35\" r=\"4\" fill=\"#94A3B8\"/><text x=\"90\" y=\"30\" font-size=\"11\" fill=\"#334155\">C</text></svg>"]],"Government":[["The 1914 amalgamation of Nigeria was carried out mainly for","religious reasons|economic and administrative convenience|military conquest|educational expansion",1,"The North's budget deficit was covered by southern revenue.","Nigerian history",""],["The Richards Constitution of 1946 is remembered for introducing","elective principle|regionalism into Nigerian administration|federalism|universal suffrage",1,"It created three regional assemblies.","Nigerian constitutions",""],["The Macpherson Constitution of 1951 introduced","regional assemblies|a central legislature with greater Nigerian participation|self-government|direct military rule",1,"It broadened participation and led to the 1953 crisis.","Nigerian constitutions",""],["Federalism was formally introduced into Nigeria by the","Richards Constitution|Macpherson Constitution|Lyttleton Constitution|Independence Constitution",2,"The 1954 Lyttleton Constitution created the federal structure.","Nigerian constitutions",""],["Under the Independence Constitution of 1960, Nigeria practised","presidential government|parliamentary government|military rule|confederalism",1,"Westminster model with the Queen as head of state.","Nigerian constitutions",""],["Nigeria became a Republic in 1963, making the President","commander-in-chief with executive power|a ceremonial head of state|a prime minister|an colonial officer",1,"Azikiwe became a ceremonial executive-limited president.","Nigerian constitutions",""],["The 1979 Constitution introduced the ___ system of government.","parliamentary|presidential|confederal|military",1,"US-style executive presidency replaced parliamentarism.","Nigerian constitutions",""],["Nigeria currently operates under the","1979 Constitution|1989 Constitution|1999 Constitution|1963 Constitution",2,"The 1999 Constitution (as amended) is in force.","Nigerian constitutions",""],["A key feature of federalism is","one central unit only|a written constitution dividing powers|unwritten conventions|military command",1,"Powers are shared between centre and units.","Political concepts",""],["Features of Nigerian federalism include all EXCEPT","written constitution|division of powers|supremacy of the centre in all matters|state governments",2,"Some powers are exclusive, some concurrent — not all central.","Political concepts",""],["The Northern People's Congress (NPC) was led by","Nnamdi Azikiwe|Ahmadu Bello|Obafemi Awolowo|Herbert Macaulay",1,"The Sardauna of Sokoto led the NPC.","First Republic",""],["The National Council of Nigeria and the Cameroons (NCNC) was led by","Ahmadu Bello|Obafemi Awolowo|Nnamdi Azikiwe|Tafawa Balewa",2,"Azikiwe led the NCNC.","First Republic",""],["The Action Group, formed in 1951, was led by","Obafemi Awolowo|Nnamdi Azikiwe|Ernest Ikoli|Samuel Akisanya",0,"Awolowo founded the AG from the Egbe Omo Oduduwa.","First Republic",""],["The first Nigerian political party, formed in 1923, was the","NCNC|NNDP|AG|NPC",1,"Herbert Macaulay's Nigerian National Democratic Party.","Nationalism",""],["The 1962/1963 census controversy in Nigeria centred on","election rigging|inflated population figures|boundary disputes|currency reform",1,"Regional inflation of figures destroyed census credibility.","First Republic",""],["The January 15, 1966 coup was led by","Yakubu Gowon|Chukwuma Nzeogwu|Johnson Aguiyi-Ironsi|Murtala Mohammed",1,"Major Nzeogwu led the first military coup.","Military era",""],["The Unification Decree No. 34 of 1966, which made Nigeria a unitary state, provoked","southern celebration|northern protests and the July counter-coup|new elections|constitutional reform",1,"It was seen as Igbo domination and triggered the July coup.","Military era",""],["The Nigerian Civil War lasted from","1966 to 1970|1967 to 1970|1967 to 1969|1970 to 1973",1,"Biafra seceded in May 1967; war ended January 1970.","Military era",""],["Post-war reconciliation was pursued through the 3Rs: Reconstruction, Rehabilitation and","Revenge|Reintegration|Reform|Recolonisation",1,"Gowon's 'No victor, no vanquished' policy.","Military era",""],["The 1975 bloodless coup that removed General Gowon was led by","Murtala Mohammed|Olusegun Obasanjo|Ibrahim Babangida|Sani Abacha",0,"Murtala Mohammed led it while Gowon was in Kampala.","Military era",""],["The decision to build a new federal capital at Abuja was taken under","Gowon|Murtala/Obasanjo regime|Shagari|Abacha",1,"The Murtala regime announced Abuja in 1976.","Military era",""],["Nigeria's first executive President under the 1979 Constitution was","Nnamdi Azikiwe|Shehu Shagari|Olusegun Obasanjo|Abubakar Tafawa Balewa",1,"Shagari of the NPN won the 1979 election.","Second Republic",""],["General Buhari took power on","January 15, 1966|December 31, 1983|August 27, 1985|November 17, 1993",1,"The 1983 New Year's Eve coup ended the Second Republic.","Military era",""],["The Structural Adjustment Programme (SAP) was introduced in 1986 under","Buhari|Babangida|Abacha|Abdulsalami",1,"IBB adopted IMF-backed reforms.","Milit epresents","0.5 km|5 km|50 km|0.05 km",0,"1 cm × 50,000 cm = 50,000 cm = 0.5 km.","Map reading",""],["On a 1:25,000 map, a distance of 4 cm on paper equals","1 km|10 km|0.25 km|2.5 km",0,"4 × 25,000 cm = 100,000 cm = 1 km.","Map reading",""],["A river falls 100 m over a horizontal distance of 2 km. The gradient is","1:5|1:20|1:2|1:50",1,"100 m rise over 2,000 m = 1 in 20.","Map reading",""],["Contour lines drawn very close together indicate","a gentle slope|a steep slope|a plateau|flat land",1,"Rapid height change over short distance.","Map reading",""],["On a topographic map, V-shaped contour lines pointing UPHILL indicate","a valley|a ridge/spur|a cliff|a lake",1,"Spurs point downhill; Vs in valleys point uphill.","Map reading",""],["A settlement arranged along a road or river is","nucleated|linear|dispersed|isolated",1,"Linear settlements follow a line of communication.","Settlement",""],["The ITCZ brings rain to a region when it","moves poleward past it|stays far away|weakens over the sea|retreats south only",0,"Rain belt follows the overhead sun/ITCZ position.","Climate",""],["The harmattan in Nigeria is caused by","the moist SW monsoon|the dry NE trade wind|sea breezes|the equatorial westerlies",1,"Dry, dusty north-east trades from the Sahara.","Climate",""],["Afternoon thunderstorms with heavy showers typical of southern Nigeria are chiefly","frontal rain|convectional rain|relief rain|cyclonic rain",1,"Intense heating causes convectional rainfall.","Climate",""],["Rainfall totals in Nigeria generally","increase northwards|decrease northwards|are even throughout|peak in the middle belt only",1,"Coastal south gets over 2,000 mm; the far north under 600 mm.","Climate",""],["The vegetation belt lying between the rainforest and the Sudan savanna is the","mangrove swamp|Guinea savanna|Sahel|montane forest",1,"Guinea savanna is the transitional woodland.","Vegetation",""],["Mangrove swamps occur along the coast where","rivers deposit fresh sand|tidal sea water floods the shore|mountains meet the sea|rains fail",1,"Brackish tidal flats host mangroves.","Vegetation",""],["An inselberg is","a volcanic cone|a resistant residual hill rising from a plain|a coral reef|a river delta",1,"An 'island mountain' left by erosion.","Landforms",""],["A mesa is a landform with","a rounded top|a flat top and steep sides|a V-valley|a crater",1,"A flat-topped table land of resistant rock.","Landforms",""],["Karst topography is developed chiefly in","granite|limestone|sandstone|basalt",1,"Carbonation of limestone produces sinkholes and caves.","Landforms",""],["Stalactites and stalagmites are features of","river deltas|limestone caves|sand dunes|glaciers",1,"Dripstone deposits in limestone caverns.","Landforms",""],["A corrie (cirque) is a landform of","river erosion|glacial erosion in a mountain hollow|wind erosion|coastal deposition",1,"Bowl-shaped hollow scoured by valley glacier.","Landforms",""],["Material deposited directly by a glacier is called","alluvium|moraine|loess|talus",1,"Unsorted glacial till dumped as moraine.","Landforms",""],["A crescent-shaped sand dune with its horns pointing downwind is a","barchan|seif|star dune|dome",0,"Barchans migrate across desert floors.","Landforms",""],["Wind erosion that hollows out rock basins and lowers desert floors is","abrasion|deflation|attrition|solution",1,"Deflation blows loose particles away, lowering the surface.","Landforms",""],["In the youthful stage, a river mainly","meanders widely|flows in a steep V-shaped valley|deposits a delta|flows sluggishly",1,"Vertical erosion dominates upstream.","Rivers",""],["An ox-bow lake forms when","a dam is built|a meander neck is cut off|a river floods|springs dry up",1,"The cut-off loop is stranded as a lake.","Rivers",""],["A levee is a natural embankment of","coarse boulders|fine silt along a river's floodplain edge|volcanic ash|sand dunes",1,"Coarser deposits build banks at flood time.","Rivers",""],["Deltas form where rivers meet the sea and the water is","deep and tidal|shallow and fairly calm with fine sediment|rapid and cold|frozen",1,"Shallow shelf + weak currents allow deposition; the Niger delta is arcuate.","Rivers",""],["A sill differs from a dyke in that a sill is","vertical|horizontal (concordant)|curved|sedimentary",1,"Sills intrude parallel to bedding planes.","Landforms",""],["A rift valley forms when","tension cracks the crust and blocks sink|plates collide head-on|rivers erode|volcanoes erupt only",1,"Tensional faulting dropped the central block — East African Rift.","Landforms",""],["Exfoliation, the peeling of rock layers, results from","chemical decay|daily temperature changes|glacial plucking|wave action",1,"Thermal expansion and contraction shed onion skins.","Weathering",""],["The correct soil profile order from top down is","A, O, B, C, R|O, A, B, C, R|B, A, C, O|R, C, B, A",1,"O = organic litter, A = topsoil, B = subsoil, C = parent, R = bedrock.","Soils",""],["The best soil texture for most crops is","clay|sand|loam|gravel",2,"Loam balances drainage and nutrient retention.","Soils",""],["Lateritic soils of the tropics are rich in","calcium|iron and aluminium oxides|sodium|humus",1,"Leaching concentrates Fe and Al oxides.","Soils",""],["Deep gully erosion like that at Agulu (Anambra) is best checked by","planting cover crops and terracing|burning stubble|overgrazing|deep ploughing downhill",0,"Vegetation and terraces bind the soil.","Soil erosion",""],["Contour ploughing reduces erosion because furrows","run downhill and drain fast|follow the contour, slowing run-off|are deeper|are wider",1,"Across-the-slope furrows trap water.","Soil erosion",""],["Population density is obtained by dividing","area by population|population by area|births by deaths|population by houses",1,"People per unit area of land.","Population",""],["Pull factors of migration include","war and famine|jobs, education and better services|drought|land disputes",1,"Attractions draw migrants in.","Population",""],["Maj stic heads are renowned worldwide.","Early Nigerian societies"],["The British punitive expedition of 1897 looted treasures from","Oyo|Benin|Kano|Sokoto",1,"Benin bronzes were carted away after the invasion.","Early Nigerian societies"],["In the Oyo empire, the Oyo Mesi functioned mainly as","tax collectors|constitutional checks on the Alaafin|war generals|palace priests",1,"They could compel a bad Alaafin to reject the calabash (abdicate).","Early Nigerian societies"],["The Oyo empire collapsed partly because","Afonja of Ilorin rebelled with Fulani help|the Alaafin moved to Lagos|rivers flooded|the British invaded Oyo first",0,"Afonja's rebellion plus Fulani pressure broke Oyo.","Early Nigerian societies"],["Mai Idris Alooma of Kanem-Bornu is remembered for introducing","Christianity|firearms and Islamic law reforms|cotton|the railway",1,"He modernised the army with muskets and appointed qadis.","Early Nigerian societies"],["The Hausa city-states include","Kano, Katsina and Zaria|Oyo, Ife and Benin|Nupe, Jukun and Igala|Borno, Wadai and Darfur",0,"Bayajidda legend links Daura to the Hausa states.","Early Nigerian societies"],["Usman dan Fodio's jihad of 1804 led to","the Benin empire|the Sokoto Caliphate|the Oyo empire|Nok culture",1,"The jihad founded the vast Sokoto Caliphate.","Early Nigerian societies"],["A major cause of the 1804 jihad was","high taxation, corruption and syncretic religion|land scarcity in Lagos|the slave trade alone|colonial taxes",0,"Religious revival fused with grievances against Hausa rulers.","Early Nigerian societies"],["The Igbo pre-colonial political system was largely","centralised monarchy|acephalous — village groups with elders and age grades|theocratic|military rule",1,"No paramount kings: councils and age grades governed.","Early Nigerian societies"],["The trans-Atlantic slave trade depopulated West Africa chiefly by","exporting captives across the ocean|settling colonists|building schools|importing cloth",0,"Millions were shipped to the Americas.","Slave trade"],["British abolition of the slave trade (1807) was driven by","industrial needs, economics and humanitarian pressure|lack of ships|African kings' petitions|weather",0,"Industry wanted raw materials and markets; voices condemned slavery.","Slave trade"],["Lagos was annexed by Britain in 1861 chiefly to","stop the slave trade and secure trade routes|build a university|grow cocoa|mine gold",0,"King Dosunmu ceded Lagos under treaty pressure.","Colonial rule"],["The Berlin Conference of 1884–85 established the principle of","effective occupation|indirect rule|free education|war reparations",0,"Powers had to occupy and administer to claim territory.","Colonial rule"],["The Royal Niger Company under George Goldie held a royal charter from","1861|1886|1900|1914",1,"Chartered in 1886 to administer the lower Niger.","Colonial rule"],["In 1900 the Royal Niger Company's territories were transferred to the British government for","£865,000|£86,500|£8,650,000|£1,000",0,"The company sold its charter territories.","Colonial rule"],["The Oil Rivers Protectorate was renamed in 1893 as the","Colony of Lagos|Niger Coast Protectorate|Southern Nigeria|Gold Coast",1,"It became the Niger Coast Protectorate.","Colonial rule"],["Indirect rule worked well in Northern Nigeria because","the British built schools first|existing emirate institutions were used|the north had no rulers|chiefs were elected",1,"Emirs retained authority under British supervision.","Colonial rule"],["Indirect rule failed in Igbo country mainly because","the Igbo were absent|no central traditional chiefs existed to mediate|the British refused to appoint anyone|the people welcomed warrant chiefs as kings",1,"Invented warrant chiefs lacked legitimacy.","Colonial rule"],["The Clifford Constitution of 1922 introduced","regionalism|the elective principle — 4 seats for Lagos and Calabar|federalism|universal suffrage",1,"A limited elective principle began.","Nationalism"],["Herbert Macaulay's Nigerian National Democratic Party dominated elections in","Calabar|Lagos|Kano|Enugu",1,"NNDP swept Lagos legislative seats in the 1920s.","Nationalism"],["Nnamdi Azikiwe's West African Pilot popularised the slogan","Blackman's Burden|Show the light and the people will find the way|Africa for Africans at home|Liberty, Equality, Fraternity",1,"The Pilot championed nationalist ideas.","Nationalism"],["The 1953 self-government motion that sparked the Kano riots was moved by","Ahmadu Bello|Anthony Enahoro|Obafemi Awolowo|Tafawa Balewa",1,"Enahoro moved 'self-government in 1956'.","Nationalism"],["After the 1953 crisis, the constitution that formalised federalism in 1954 was","Richards|Macpherson|Lyttleton|Oliver Littleton's draft only",2,"Lyttleton's 1954 constitution created the federation.","Nationalism"],["Eastern and Western regions attained self-government in 1957; the Northern region followed in","1958|1959|1960|1957",1,"The North became self-governing in 1959.","Nationalism"],["At independence on 1 October 1960, Nigeria's head of government was","the President|the Prime Minister (Abubakar Tafawa Balewa)|the Governor-General alone|the Queen directly",1,"Balewa was federal Prime Minister; Azikiwe became Governor-General.","Independence"],["Nigeria's first (ceremonial) President in 1963 was","Obafemi Awolowo|Nnamdi Azikiwe|Tafawa Balewa|Ahmadu Bello",1,"Azikiwe became President under the Republican constitution.","First Republic"],["The 1962 crisis in the Action Group centred on","census fraud|Awolowo's succession and ideology disputes with Akintola|oil revenue|foreign policy",1,"The AG split over leadership and strategy.","First Republic"],["The 1964 federal election crisis deepened when","NPC and NNDP allies were opposed by UPGA which boycotted parts|all parties agreed|Britain annulled it|the army supported the opposition",0,"UPGA boycotts in some regions worsened tension.","First Republic"],["The Western Region election crisis of 1965 was nicknamed","Operation Wetie   var vl=(VIDS[LANG]&&VIDS[LANG][key])?LANG:"en";
  var id=(VIDS[vl]&&VIDS[vl][key])||VIDS.en[key]||"";
  if(!id){toastIf("No lesson video for this subject yet.");return;}
  document.getElementById("vtitle").textContent=topic+" — "+sel.sub+(vl!==LANG?" · English":"");
  document.getElementById("vframe").src=vurl(id);
  document.getElementById("vwrap").className="ovl";
}
function toastIf(m){try{var d=document.getElementById("vhint");if(d)d.textContent=m;}catch(e){}}
function closeVid(){var f=document.getElementById("vframe");f.src="";document.getElementById("vwrap").className="ovl hide";}
/* ---------- flow ---------- */
function home(){
 closeVid();if(sel.t)clearInterval(sel.t);
 sel={c:null,ex:null,sub:null,pool:[],q:[],i:0,answers:[],perms:[],t:null,left:0,perq:45};
 var ln=LANG!=="en"?'<div class="note" style="background:#FEF9C3;border:1px solid #FDE68A;border-radius:10px;padding:8px 10px">'+T("klangnote")+'</div>':"";
 h('<div class="card"><h2>'+T("k1")+'</h2><div class="chips">'+
   Object.keys(COUNTRY).map(function(c){return '<button class="chip" onclick="pickC(this.textContent)">'+c+'</button>';}).join("")+
   '</div><div class="note">'+T("kblurb")+'</div>'+ln+'</div><div id="step2"></div><div id="step3"></div>');
}
function pickC(c){sel.c=c;sel.ex=null;sel.sub=null;
 document.getElementById("step2").innerHTML='<div class="card"><h2>'+T("k2")+'</h2><div class="chips">'+
  COUNTRY[c].map(function(e){return '<button class="chip" onclick="pickEx(\''+e+'\')">'+labelOf(e)+'</button>';}).join("")+'</div></div><div id="step3"></div>';
 window.scrollTo(0,document.body.scrollHeight);
}
function pickEx(e){sel.ex=e;sel.sub=null;
 var s=subs(e),names=Object.keys(s);
 document.getElementById("step3").innerHTML='<div class="card"><h2>'+T("k3")+labelOf(e)+'</h2>'+
  '<div class="chips">'+names.map(function(n){var p=poolFor(e,n);return '<button class="chip" onclick="pickSub(\''+n.replace(/'/g,"\\'")+'\')">'+n+' · '+(p?p.length:0)+' q</button>';}).join("")+'</div></div><div id="step4"></div>';
 window.scrollTo(0,document.body.scrollHeight);
}
function pickSub(s){
 sel.sub=s;var pool=poolFor(sel.ex,s);sel.pool=pool;
 var topics=[];(pool||[]).forEach(function(q){if(topics.indexOf(q[4])<0)topics.push(q[4]);});
 document.getElementById("step4").innerHTML='<div class="card"><h2>'+labelOf(sel.ex)+' — '+s+'</h2>'+
  '<div style="font-size:12.5px;color:var(--mut);margin-bottom:9px">'+T("ktap")+'</div>'+
  '<div class="chips">'+topics.map(function(t){return '<button class="chip count" onclick="playTopic(this.textContent)">▶ '+t+'</button>';}).join("")+'</div>'+
  '<div class="note">'+(pool?pool.length:0)+T("kbank")+'</div>'+
  '<button class="btn g" onclick="startPractice(50)">'+T("kstart")+Math.round(50*sel.perq/60)+' min)</button>'+
  '<button class="btn o" onclick="startPractice(20)">'+T("kquick")+'</button>';
 window.scrollTo(0,document.body.scrollHeight);
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startPractice(n){
 closeVid();
 var all=shuffle(sel.pool||[]);
 sel.q=all.slice(0,Math.min(n,all.length));
 sel.i=0;sel.answers=[];sel.perms=[];
 for(var k=0;k<sel.q.length;k++){sel.perms.push(shuffle([0,1,2,3]));sel.answers.push(undefined);}
 sel.left=sel.q.length*sel.perq;
 if(sel.t)clearInterval(sel.t);
 sel.t=setInterval(function(){sel.left--;var el=document.getElementById("tm");if(el){el.textContent=fmt(sel.left);if(sel.left<=30)el.className="timer low";}if(sel.left<=0)finish();},1000);
 renderQ();
}
function opts(q,perm){var o=String(q[1]).split("|");return perm.map(function(i){return o[i];});}
function diag(q){return q[5]?'<div class="dq">'+q[5]+'</div>':"";}
function renderQ(){
 var q=sel.q[sel.i],perm=sel.perms[sel.i],os=opts(q,perm);
 h('<div class="qcard"><div class="qhead"><span>'+T("kq")+(sel.i+1)+T("kof")+sel.q.length+'</span><span class="timer" id="tm">'+fmt(sel.left)+'</span></div>'+
  '<div class="bar"><i style="width:'+Math.round(sel.i/sel.q.length*100)+'%"></i></div>'+
  '<button class="topic" onclick="playTopic(this.textContent)">'+q[4]+'</button><div class="qq">'+q[0]+'</div>'+diag(q)+
  os.map(function(o,k){return '<button class="opt" onclick="pick('+k+')">'+String.fromCharCode(65+k)+". "+o+'</button>';}).join("")+
  '<div class="nav"><button class="btn o" style="'+(sel.i===0?"visibility:hidden":"")+'" onclick="prev()">'+T("kprev")+'</button>'+
  '<button class="btn g" onclick="next()">'+(sel.i===sel.q.length-1?T("ksubmit"):T("knext"))+'</button></div>'+
  '<button class="btn o" style="margin-top:10px" onclick="if(confirm(\''+T("kconfirm")+'\'))finish()">'+T("kend")+'</button></div>');
 if(sel.answers[sel.i]!==undefined){var b2=document.querySelectorAll(".opt")[sel.answers[sel.i]];if(b2)b2.className="opt picked";}
}
function pick(k){sel.answers[sel.i]=k;var os=document.querySelectorAll(".opt");for(var j=0;j<os.length;j++)os[j].className="opt";if(os[k])os[k].className="opt picked";}
function prev(){if(sel.i>0){sel.i--;renderQ();}}
function next(){if(sel.i<sel.q.length-1){sel.i++;renderQ();}else finish();}
function finish(){
 if(sel.t)clearInterval(sel.t);closeVid();
 var right=0,rows="";
 for(var i=0;i<sel.q.length;i++){
  var q=sel.q[i],perm=sel.perms[i],ans=sel.answers[i];
  var shown=perm.indexOf(q[2]); /* bank answer index mapped to displayed position */
  var ok=ans===shown;if(ok)right++;
  rows+='<div class="qcard"><button class="topic" onclick="playTopic(this.textContent)">'+q[4]+'</button><div class="qq">'+q[0]+'</div>'+diag(q)+
   opts(q,perm).map(function(o,k){return '<button class="opt '+(k===shown?"right":(ans===k?"wrong":""))+'" disabled>'+String.fromCharCode(65+k)+". "+o+'</button>';}).join("")+
   (ok?'<div class="expl">'+T("kcorrect")+q[3]+'</div>':'<div class="expl">'+(ans===undefined?T("kna"):T("kinc")+String.fromCharCode(65+shown)+". ")+q[3]+'</div>')+
   '<button class="topic" style="margin-top:8px" onclick="playTopic(this.textContent)">'+T("krevise")+q[4]+'</button></div>';
 }
 var pct=sel.q.length?Math.round(right/sel.q.length*100):0;
 var msg=pct>=80?"🏆":pct>=60?"💪":"📚";
 h('<div class="card" style="text-align:center"><div class="score">'+pct+'% '+msg+'</div><div style="color:var(--mut);margin-bottom:5px">'+right+' / '+sel.q.length+' · '+labelOf(sel.ex)+' · '+sel.sub+'</div>'+
  '<button class="btn g" onclick="startPractice(50)">'+T("kretake")+'</button>'+
  '<button class="btn o" onclick="home()">'+T("kanother")+'</button></div>'+rows);
}
function goHome(){location.href="/app";}
/* localize the static header + player chrome */
(function(){
 try{
  var st=document.querySelector(".top .sub");if(st&&LANG!=="en")st.textContent=T("kblurb");
  var vh=document.getElementById("vhint");if(vh&&LANG!=="en")vh.textContent=T("kvhint");
  var vc=document.getElementById("vcloseb");if(vc&&LANG!=="en")vc.textContent=T("kclose");
  var ht=document.querySelector(".top h1");
  if(ht){var bp=document.createElement("div");bp.style.cssText="margin-top:6px";bp.innerHTML=langsel();ht.parentNode.appendChild(bp);}
 }catch(e){}
})();
home();

</script>
</body>
</html>
