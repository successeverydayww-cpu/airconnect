<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skylar Forge — Build your app</title>
<style>
:root{--bg:#0b141a;--pan:#111f29;--pan2:#0e1a23;--acc:#00a884;--acc2:#0ea5e9;--txt:#e8f0f4;--dim:#7b93a3;--line:#1d3040}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column}
input,textarea{background:var(--pan2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;width:100%;font:inherit}
input:focus{outline:1px solid var(--acc)}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;width:100%}
.btn.ghost{background:var(--pan);border:1px solid var(--line);color:var(--txt)}
.btn:active{opacity:.8}
#auth{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;padding:20px;max-width:380px;margin:0 auto}
#auth h1{font-size:26px}#auth h1 b{color:var(--acc)}
#auth p{color:var(--dim);font-size:13px;text-align:center}
#chat{display:none;flex:1;flex-direction:column;max-width:720px;margin:0 auto;width:100%}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
header h2{font-size:16px;flex:1}header h2 small{display:block;color:var(--dim);font-weight:400;font-size:11px}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.m.u{align-self:flex-end;background:linear-gradient(135deg,#005c4b,#00a884);border-bottom-right-radius:4px}
.m.a{align-self:flex-start;background:var(--pan);border:1px solid var(--line);border-bottom-left-radius:4px}
.m.a .ops{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);color:var(--acc2);font-size:12px}
.typing{align-self:flex-start;color:var(--dim);font-size:12px;padding:6px 14px}
#composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--bg)}
#composer textarea{flex:1;resize:none;border-radius:20px;padding:10px 14px}
#composer button{flex:0 0 54px;border-radius:50%;background:var(--acc);border:none;color:#fff;font-size:20px;cursor:pointer}
.foot{padding:12px;text-align:center;color:var(--dim);font-size:11px}
#toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#0a2e24;border:1px solid var(--acc);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;display:none;z-index:99}
</style>
</head>
<body>
<div id="auth">
  <h1>🔨 Skylar <b>Forge</b></h1>
  <p>Describe your app in plain words. The AI builds it — data tables, records, functions. Your own workspace, your own app.</p>
  <input id="f_name" placeholder="Your name">
  <input id="f_email" type="email" placeholder="Email">
  <input id="f_pass" type="password" placeholder="Password (6+ characters)">
  <button class="btn" onclick="signup()">Create my workspace — free</button>
  <p>Already have one?</p>
  <button class="btn ghost" onclick="login()">Sign in</button>
  <p id="aerr" style="color:#ff8f8f"></p>
</div>
<div id="chat">
  <header>
    <h2>🔨 Skylar Forge <small id="whoami">workspace</small></h2>
    <button class="btn ghost" style="width:auto;padding:8px 12px;font-size:12px" onclick="logout()">Sign out</button>
  </header>
  <div id="msgs"></div>
  <div class="typing" id="typing" style="display:none">building…</div>
  <div id="composer">
    <textarea id="msg" rows="1" placeholder="Describe your app… e.g. 'Build me a shop with products and orders'"></textarea>
    <button onclick="send()">➤</button>
  </div>
  <div class="foot">Skylar Forge v0.1 — built by Premium User · powered by your words</div>
</div>
<div id="toast"></div>
<script>
const API = "https://skylar-forge.successeverydayww-cpu.workers.dev/api";
let KEY = sessionStorage.getItem("forge_build_key") || "";
let EMAIL = sessionStorage.getItem("forge_build_email") || "";
if (KEY) enter();
function toast(m,bad){const t=document.getElementById("toast");t.textContent=m;t.style.borderColor=bad?"#b3392f":"var(--acc)";t.style.display="block";setTimeout(()=>t.style.display="none",2800);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(p){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});return r.json();}
async function authed(act){
  const email=document.getElementById("f_email").value.trim().toLowerCase();
  const pass=document.getElementById("f_pass").value;
  const name=document.getElementById("f_name").value.trim()||email.split("@")[0];
  if(!email||!pass){document.getElementById("aerr").textContent="Email and password required.";return;}
  const r=await api({act,email,password:pass,name});
  if(r.err){document.getElementById("aerr").textContent=r.err;return;}
  KEY=r.key;EMAIL=email;
  sessionStorage.setItem("forge_build_key",KEY);sessionStorage.setItem("forge_build_email",EMAIL);
  enter();
}
function signup(){authed("user.signup")}
function login(){authed("user.login")}
function enter(){document.getElementById("auth").style.display="none";document.getElementById("chat").style.display="flex";document.getElementById("whoami").textContent=EMAIL;loadChat();}
function logout(){sessionStorage.clear();KEY="";location.reload();}
async function loadChat(){
  const r=await api({act:"build.chat",key:KEY});
  const m=document.getElementById("msgs");
  m.innerHTML="";
  (r.chat||[]).forEach(c=>addBubble(c.role==="user"?"u":"a",c.text));
  if(!(r.chat||[]).length)addBubble("a","Welcome to your workspace. Tell me what app you want — for example: \"a school with students, classes and fees\" — and I will build the data, records and functions for you.");
  m.scrollTop=m.scrollHeight;
}
function addBubble(cls,text,ops){
  const m=document.getElementById("msgs");
  const d=document.createElement("div");d.className="m "+cls;
  d.innerHTML=esc(text)+(ops&&ops.length?`<div class="ops">✓ ${ops.map(esc).join("<br>✓ ")}</div>`:"");
  m.appendChild(d);m.scrollTop=m.scrollHeight;return d;
}
async function send(){
  const ta=document.getElementById("msg");const v=ta.value.trim();if(!v)return;
  ta.value="";addBubble("u",v);
  document.getElementById("typing").style.display="block";
  const r=await api({act:"build.msg",key:KEY,msg:v});
  document.getElementById("typing").style.display="none";
  if(r.err){toast(r.err,1);return;}
  addBubble("a",r.reply||"(no reply)",r.executed||[]);
}
document.getElementById("msg").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
</script>
</body>
</html>
