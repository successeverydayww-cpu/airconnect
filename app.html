<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My App — Skylar Forge</title>
<style>
:root{--bg:#0b141a;--pan:#111f29;--pan2:#0e1a23;--acc:#00a884;--acc2:#0ea5e9;--txt:#e8f0f4;--dim:#7b93a3;--line:#1d3040}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column}
button,input,textarea,select{font:inherit}
.hidden{display:none!important}
#gate{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:12px;padding:20px;max-width:380px;margin:0 auto}
#gate h1{font-size:22px}#gate h1 b{color:var(--acc)}#gate p{color:var(--dim);font-size:13px;text-align:center}
input,textarea,select{background:var(--pan2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;width:100%}
.btn{background:var(--acc);color:#fff;border:none;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;width:100%}
.btn.ghost{background:var(--pan);border:1px solid var(--line);color:var(--txt)}
.btn.blue{background:var(--acc2)}.btn.red{background:#b3392f}.btn:active{opacity:.8}
header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
header h2{font-size:17px;flex:1}header h2 small{display:block;color:var(--dim);font-weight:400;font-size:11px}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line)}
nav .tab{white-space:nowrap;padding:8px 16px;border-radius:20px;background:var(--pan);border:1px solid var(--line);color:var(--txt);font-size:13px;cursor:pointer}
nav .tab.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
main{flex:1;padding:14px;display:flex;flex-direction:column;gap:14px;max-width:760px;margin:0 auto;width:100%}
.card{background:var(--pan);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:15px;display:flex;justify-content:space-between;align-items:center}
.card h3 .r{color:var(--dim);font-size:11px;font-weight:400}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{color:var(--dim);text-align:left;padding:7px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px;border-bottom:1px solid var(--pan2);vertical-align:top;word-break:break-word}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:var(--dim)}
.row{display:flex;gap:8px}.row>*{flex:1}
.dim{color:var(--dim);font-size:12px}
.empty{color:var(--dim);text-align:center;padding:24px 0;font-size:13px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0a2e24;border:1px solid var(--acc);color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;display:none;z-index:99}
</style>
</head>
<body>
<div id="gate">
  <h1>🚀 <b>My App</b></h1>
  <p>Your live app, generated from your workspace.<br>Sign in with your Forge email + password.</p>
  <input id="g_email" type="email" placeholder="Email">
  <input id="g_pass" type="password" placeholder="Password">
  <button class="btn" onclick="gateLogin()">Open my app</button>
  <p id="gerr" style="color:#ff8f8f"></p>
</div>
<div id="approot" class="hidden">
  <header>
    <h2 id="apptitle">My App <small>generated by Skylar Forge</small></h2>
    <button class="btn ghost" style="width:auto;padding:8px 12px;font-size:12px" onclick="location.href='build.html'">✏️ Builder</button>
  </header>
  <nav id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="toast"></div>
<script>
const API = "https://skylar-forge.successeverydayww-cpu.workers.dev/api";
let KEY = sessionStorage.getItem("fapp_key") || "";
let SCHEMAS = [];
let CURRENT = "";
if (KEY) boot(); else { /* allow key via URL ?k= */ const qk = new URLSearchParams(location.search).get("k"); if (qk) { KEY = qk; sessionStorage.setItem("fapp_key", qk); boot(); } }
function toast(m,bad){const t=document.getElementById("toast");t.textContent=m;t.style.borderColor=bad?"#b3392f":"var(--acc)";t.style.display="block";setTimeout(()=>t.style.display="none",2400);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function api(p){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});return r.json();}
async function gateLogin(){
  const email=document.getElementById("g_email").value.trim().toLowerCase();
  const pass=document.getElementById("g_pass").value;
  if(!email||!pass){document.getElementById("gerr").textContent="Email and password required.";return;}
  const r=await api({act:"user.login",email,password:pass});
  if(r.err){document.getElementById("gerr").textContent=r.err;return;}
  KEY=r.key;sessionStorage.setItem("fapp_key",KEY);boot();
}
async function boot(){
  const r=await api({act:"schema.list",key:KEY});
  if(r.err){toast("Session expired — sign in again",1);sessionStorage.removeItem("fapp_key");KEY="";document.getElementById("approot").classList.add("hidden");document.getElementById("gate").style.display="flex";return;}
  SCHEMAS=r.schemas||[];
  document.getElementById("gate").style.display="none";
  document.getElementById("approot").classList.remove("hidden");
  const tabs=document.getElementById("tabs");
  tabs.innerHTML=SCHEMAS.map(s=>`<div class="tab" onclick="openTab('${esc(s.entity)}')">${esc(s.entity)}</div>`).join("")||`<span class="dim">No entities yet — open the Builder to create some.</span>`;
  if(SCHEMAS.length) openTab(SCHEMAS[0].entity); else document.getElementById("view").innerHTML=`<div class="empty">Your app is empty. Go to ✏️ Builder and describe what you want.</div>`;
}
function openTab(entity){
  CURRENT=entity;
  document.querySelectorAll("#tabs .tab").forEach(t=>t.classList.toggle("on",t.textContent===entity));
  renderList();
}
async function renderList(){
  const r=await api({act:"rec.list",key:KEY,entity:CURRENT,limit:100});
  const recs=r.records||[];
  const keys=[...new Set(recs.flatMap(x=>Object.keys(x).filter(k=>!["id","created_at","updated_at"].includes(k))))].slice(0,6);
  const hasFn=(recs.length>0)||true;
  const rows=recs.map(x=>`<tr>${keys.map(k=>`<td>${esc(typeof x[k]==="object"?JSON.stringify(x[k]):x[k])}</td>`).join("")}<td><button class="btn ghost" style="width:auto;padding:4px 10px;font-size:11px" onclick="editRec(${x.id})">✏️</button> <button class="btn red" style="width:auto;padding:4px 10px;font-size:11px" onclick="delRec(${x.id})">✕</button></td></tr>`).join("");
  document.getElementById("view").innerHTML=`
    <div class="card">
      <h3>${esc(CURRENT)} <span class="r">${recs.length} record(s)</span></h3>
      ${recs.length?`<table class="tbl"><tr>${keys.map(k=>`<th>${esc(k)}</th>`).join("")}<th></th></tr>${rows}</table>`:`<div class="empty">No ${esc(CURRENT)} yet. Add your first one below.</div>`}
    </div>
    <div class="card">
      <h3 id="formtitle">Add ${esc(CURRENT)}</h3>
      <div id="fields" style="display:flex;flex-direction:column;gap:8px"></div>
      <input type="hidden" id="editid">
      <div class="row"><button class="btn" id="savebtn" onclick="saveRec()">Save</button>${recs.length?`<button class="btn ghost" onclick="clearForm()" style="flex:0 0 110px">Clear</button>`:""}</div>
    </div>`;
  buildFields(keys.length?keys:guessFields());
}
function guessFields(){ return ["title","name","status"]; }
function buildFields(keys){
  document.getElementById("fields").innerHTML=keys.map(k=>`<div class="field"><label>${esc(k)}</label><input data-k="${esc(k)}" id="f_${esc(k)}"></div>`).join("");
}
async function editRec(id){
  const r=await api({act:"rec.get",key:KEY,entity:CURRENT,id:id});
  if(r.err)return toast(r.err,1);
  const rec=r.record;
  const keys=Object.keys(rec).filter(k=>!["id","created_at","updated_at"].includes(k)).slice(0,6);
  buildFields(keys);
  document.getElementById("formtitle").textContent="Edit "+CURRENT+" #"+id;
  document.getElementById("editid").value=id;
  document.getElementById("savebtn").textContent="Update";
  keys.forEach(k=>{const el=document.getElementById("f_"+k);if(el)el.value=typeof rec[k]==="object"?JSON.stringify(rec[k]):rec[k];});
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
function clearForm(){
  document.getElementById("editid").value="";
  document.getElementById("savebtn").textContent="Save";
  document.getElementById("formtitle").textContent="Add "+CURRENT;
  document.querySelectorAll("#fields input").forEach(i=>i.value="");
}
async function saveRec(){
  const data={};
  document.querySelectorAll("#fields input").forEach(i=>{const k=i.dataset.k,v=i.value.trim();if(v!=="")data[k]=isNaN(+v)||v===""?v:(v.length>12?v:+v);});
  const editid=document.getElementById("editid").value;
  const r=editid?await api({act:"rec.update",key:KEY,entity:CURRENT,id:+editid,data}):await api({act:"rec.create",key:KEY,entity:CURRENT,data});
  if(r.err)return toast(r.err,1);
  toast(editid?"Updated":"Created");
  clearForm();renderList();
}
async function delRec(id){
  const r=await api({act:"rec.delete",key:KEY,entity:CURRENT,id:id});
  toast(r.err||"Deleted",!!r.err);renderList();
}
</script>
</body>
</html>
