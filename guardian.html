<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AirConnect Guardian</title>
<style>body{background:#0a1014;color:#cfd8dc;font-family:system-ui,sans-serif;padding:14px;font-size:13px}
#log{white-space:pre-wrap;background:#0b141a;border:1px solid #2a3942;border-radius:8px;padding:10px;margin-top:10px;max-height:80vh;overflow:auto}</style>
</head><body>
<div id="st">guardian booting…</div><div id="log"></div>
<script>
const FN="https://airconnect-api.successeverydayww-cpu.workers.dev";
let AID="";try{AID=localStorage.getItem("ac_aid")||"";}catch(e){}
const RINGFN="https://airconnect-api.successeverydayww-cpu.workers.dev";
const GREET="https://airconnect-api.successeverydayww-cpu.workers.dev";
const RTC_CFG={iceServers:[
  {urls:["stun:stun.l.google.com:19302","stun:stun.cloudflare.com:3478","stun:stun1.l.google.com:19302"]},
]};
const ME=new URL(location).searchParams.get("num")||localStorage.getItem("guard_num")||"";
let lastSig="",lastMsg="",pc=null,pendingIce=[],state="idle",curCaller=null,pickTimer=null;
const OFFERS={}; // caller -> {at, n}
const seenIds={}; // sig ids already processed
function log(m){const d=$("log");d.textContent+="["+new Date().toISOString().slice(11,19)+"] "+m+"\n";d.scrollTop=99999;
  fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({act:"log",msg:"GUARD "+ME.slice(-4)+": "+m})}).catch(()=>{});}
function $(id){return document.getElementById(id);}
async function api(act,body){if(AID&&!(body||{}).aid){body=Object.assign({aid:AID},body||{});}const r=await fetch(FN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({act:act},body||{}))});return r.json();}

/* SDP compression */
async function zipDesc(desc){try{
  if(typeof CompressionStream==='undefined')return desc;
  const cs=new CompressionStream('deflate-raw');
  const buf=await new Response(new Blob([JSON.stringify(desc)]).stream().pipeThrough(cs)).arrayBuffer();
  const u8=new Uint8Array(buf);let bin='';for(let i=0;i<u8.length;i++)bin+=String.fromCharCode(u8[i]);
  return {z:1,d:btoa(bin)};
}catch(e){return desc;}}
async function unzipDesc(p){
  try{
    if(!p||p.z!==1||!p.d)return p;
    const bin=atob(p.d);const u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    const ds=new DecompressionStream('deflate-raw');
    const txt=await new Response(new Blob([u8]).stream().pipeThrough(ds)).text();
    return JSON.parse(txt);
  }catch(e){return p;}
}

/* TTS via translate.google through allorigins; chunked to <=180 chars */
let voiceCtx=null,voiceBus=null,speaking=false;
let listenRec=null,heard=[];
function ensureAudio(){
  if(voiceCtx)return true;
  try{
    voiceCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});
    voiceBus=voiceCtx.createMediaStreamDestination();
    return true;
  }catch(e){log("audio ctx failed: "+e);return false;}
}
const TTS_URL="https://airconnect-api.successeverydayww-cpu.workers.dev";
const MESH="https://mesh-citizen-one.successeverydayww-cpu.workers.dev/chat";
const STT_URL="https://airconnect-api.successeverydayww-cpu.workers.dev";
async function playBuf(buf){
  const decoded=await voiceCtx.decodeAudioData(buf.slice(0));
  const src=voiceCtx.createBufferSource();src.buffer=decoded;
  const g=voiceCtx.createGain();g.gain.value=1.0;
  src.connect(g);g.connect(voiceBus);src.start();
  await new Promise(res=>{src.onended=res;setTimeout(res,decoded.duration*1000+400);});
}
async function say(text){
  if(!ensureAudio()||!voiceCtx)return;
  while(speaking)await new Promise(r=>setTimeout(r,300));
  speaking=true;
  try{
    try{
      // PREMIUM VOICE: ElevenLabs via server-side proxy (key stays on the server)
      const r=await fetch(TTS_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({act:"xtts",text:text.slice(0,900)})});
      if(!r.ok)throw 0;
      const buf=await r.arrayBuffer();
      if(buf.byteLength>2000){log("PREMIUM VOICE (ElevenLabs) speaking");await playBuf(buf);return;}
      throw 0;
    }catch(e){}
    // fallback: old robotic voice, chunked
    const chunks=text.match(/[^.!?]+[.!?]?/g)||[text];
    for(let ch of chunks){
      ch=ch.trim().slice(0,180);if(!ch)continue;
      let buf=null;
      try{
        const u="https://api.allorigins.win/raw?url="+encodeURIComponent("https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q="+encodeURIComponent(ch));
        const r=await fetch(u);if(!r.ok)throw 0;buf=await r.arrayBuffer();
      }catch(e){try{if(window.speechSynthesis){const u2=new SpeechSynthesisUtterance(ch);u2.rate=1;speechSynthesis.speak(u2);await new Promise(r2=>{u2.onend=r2;setTimeout(r2,6000);});}}catch(x){}continue;}
      try{await playBuf(buf);}catch(e){}
    }
  }finally{speaking=false;}
}

/* answer a call offer as the user's AI assistant */
async function answer(m){
  if(!ensureAudio())return;
  state="live";curCaller=m.from;
  log("answering 2nd call from +"+m.from);
  pc=new RTCPeerConnection(RTC_CFG);
  pc.onicecandidate=e=>{if(e.candidate)queueIceOut(e.candidate);};
  const rs=new MediaStream();
  pc.ontrack=e=>{try{for(const t of e.streams[0].getAudioTracks())rs.addTrack(t);if(rs.getAudioTracks().length)startListen(rs);}catch(err){}};
  pc.addTrack(voiceBus.stream.getAudioTracks()[0],voiceBus.stream);
  await pc.setRemoteDescription(m.payload);await flushIce();
  const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
  await api("sig",{from:ME,to:m.from,type:"answer",payload:await zipDesc(ans)});
  pc.onconnectionstatechange=async()=>{
    if(pc&&pc.connectionState==="connected"){
      log("LIVE — speaking greeting");
      await say("Quick note: this call is being answered by an AI assistant.");
      try{
        const br=await fetch(MESH,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session:"air-"+(curCaller||"anon"),msg:"\u260E You just answered an incoming call as the AI receptionist. Greet the caller warmly in one or two short sentences and invite them to talk."})});
        const j=await br.json();
        const rep=String((j&&j.reply)||"").trim().slice(0,600);
        if(rep)await say(rep);
        else await say("Hello! I am the AI receptionist. Please go ahead.");
      }catch(e){await say("Hello! I am the AI receptionist. Please go ahead.");}
      try{await api("chat",{from:ME,to:curCaller,text:"🤖 Auto-disclosure: this call was answered by my AI assistant — you have been talking to an AI voice."});}catch(e){}
    }
    if(pc&&(pc.connectionState==="failed"||pc.connectionState==="disconnected"||pc.connectionState==="closed")){cleanup();}
  };
}
/* PERMANENT-HOST HARDENING: keep the device awake while hosting — screen wake-lock,
   auto re-acquired whenever the tab becomes visible again (survives screen-off cycles) */
let __wk=null;
async function __keepAwake(){try{if("wakeLock" in navigator&&!__wk){__wk=await navigator.wakeLock.request("screen");__wk.addEventListener("release",()=>{__wk=null;});log&&log("host mode: device wake-lock ON");}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")__keepAwake();});
__keepAwake();

/* v21: LISTEN — capture the caller's voice, transcribe via airconnectStt, keep the voicemail */
async function startListen(stream){
  try{
    if(listenRec){try{listenRec.stop();}catch(e){}}
    const mt=MediaRecorder.isTypeSupported("audio/webm;codecs=opus")?"audio/webm;codecs=opus":"audio/webm";
    listenRec=new MediaRecorder(stream,{mimeType:mt});
    listenRec.ondataavailable=async ev=>{
      try{
        if(!ev.data||ev.data.size<2000||state!=="live")return;
        const b64=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result));fr.readAsDataURL(ev.data);});
        const r=await fetch(STT_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({act:"stt",audio:b64})});
        if(!r.ok)return;
        const j=await r.json();const txt=String(j.text||"").trim();
        if(!txt||txt.length<2)return;
        heard.push(txt);
        log("heard: "+txt.slice(0,80));
        if(heard.length===1){try{await api("chat",{from:curCaller,to:ME,text:"\u{1F4DD} (call transcript begins) "+txt.slice(0,400)});}catch(e){}}
        try{
          const br=await fetch(MESH,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session:"air-"+curCaller,msg:txt.slice(0,500)})});
          if(br.ok){const j=await br.json();const rep=String((j&&j.reply)||"").trim().slice(0,600);if(rep)await say(rep);}
        }catch(e){}
      }catch(e){}
    };
    listenRec.start(6000);
    log("listening to caller (voicemail on)");
  }catch(e){log("listen unavailable: "+e);}
}
let iceOut=[];
async function queueIceOut(c){iceOut.push(c);}
setInterval(async()=>{if(!iceOut.length||!pc||state!=="live")return;const batch=iceOut;iceOut=[];
  try{await api("sig",{from:ME,to:curCaller,type:"ice-batch",payload:batch});}catch(e){iceOut=iceOut.concat(batch);}},700);
async function queueIce(c){pendingIce.push(c);}
async function flushIce(){while(pendingIce.length&&pc){try{await pc.addIceCandidate(pendingIce.shift());}catch(e){pendingIce.shift();}}}
function cleanup(){if(listenRec){try{listenRec.stop();}catch(e){}listenRec=null;}try{if(pc)pc.close();}catch(e){}pc=null;state="idle";pendingIce=[];iceOut=[];curCaller=null;if(pickTimer){clearTimeout(pickTimer);pickTimer=null;}}
function pruneSeen(){const ks=Object.keys(seenIds);if(ks.length>300)for(const k of ks.slice(0,150))delete seenIds[k];}

/* poll */
let SIG_PRIMED=false;
async function handleSigs(msgs){
  if(!SIG_PRIMED){SIG_PRIMED=true;msgs=msgs.filter(m=>Date.now()-(m.at?new Date(m.at).getTime():0)<10000);}
  for(const m of msgs){
if(m.type==="offer"){
  let raw=m.payload;
  try{raw=typeof raw==="string"?JSON.parse(raw):raw;}catch(e){}
  const desc=await unzipDesc(raw);
  if(!desc||!desc.type){
    log("offer unparsable — keys="+(raw&&typeof raw==="object"?Object.keys(raw).join(","):typeof raw)+" cs="+(typeof CompressionStream)+" preview="+JSON.stringify(raw).slice(0,120));
    continue;
  }
  const now=Date.now();
  const sigKey=m.at||m.id;
  if(seenIds[sigKey]){continue;}
  seenIds[sigKey]=1;
  try{await api("sig",{from:ME,to:m.from,type:"ringing",payload:{}});}catch(e){}
  const rec=OFFERS[m.from];
  const VM_NODE=String(ME).indexOf("110")===0; // citizen lane (1100000xxx): no human behind this number
  const freshRec=rec&&now-rec.at<10*60*1000;
  if(!freshRec&&!VM_NODE){
    OFFERS[m.from]={at:now,n:1};
    log("1st offer from +"+m.from+" — letting the human pick");
  }else{
    OFFERS[m.from]={at:now,n:(rec.n||1)+1};
    if(state!=="live"&&!pc&&!pickTimer){
      log((VM_NODE?"citizen mode — ":"2nd offer from +"+m.from+" — ")+"AI picks in 3s");
      const offer=m;
      pickTimer=setTimeout(async()=>{
        pickTimer=null;
        if(state!=="live"&&!pc){
          offer.payload=desc;
          try{await answer(offer);}catch(e){log("answer failed: "+(e&&e.message||e));cleanup();}
        }
      },3000);
    }
  }
}
else if(m.type==="ice"&&pc){await queueIce(m.payload);}
else if(m.type==="ice-batch"&&pc){for(const c of m.payload)await queueIce(c);}
else if(m.type==="bye"){if(state==="live"||pc){log("caller +"+m.from+" ended call");cleanup();}}
else if(m.type==="noans"){
  try{await api("chat",{from:ME,to:m.from,text:"📞 Sorry I missed your call. I'll call you back — if it's urgent, reply here and I'll get it instantly."});log("voicemail notice sent to +"+m.from);}catch(e){}
}
  }
}
let ringLast=new Date().toISOString(),ringBusy=false;
async function ringLoop(){
  if(ringBusy){setTimeout(ringLoop,400);return;}
  ringBusy=true;
  try{
    const r=await fetch(RINGFN,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({act:"ring",node:ME,since:ringLast})});
    if(r.ok){
      const d=await r.json();
      const msgs=d.sigs||[];
      if(msgs.length){ringLast=msgs[msgs.length-1].at;await handleSigs(msgs);}
    }
  }catch(e){}
  ringBusy=false;
  setTimeout(ringLoop,1400);
}

async function poll(){
  try{
    const d=await api("sync",{node:ME,since:lastSig,sinceMsg:lastMsg});
    if(d.err){$("st").textContent="err: "+d.err;setTimeout(poll,5000);return;}
    const msgs=d.sigs||[];
    if(msgs.length)lastSig=msgs[msgs.length-1].id;
    await handleSigs(msgs);
    for(const r of (d.requests||[])){
      await api("accept",{user:ME,id:r.id});
      log("accepted friend request from +"+r.from);
    }
    const dm=d.messages||d.msgs||[];
    lastMsg=dm.length?(dm[dm.length-1].id||dm[dm.length-1].at):lastMsg;
    pruneSeen();
    $("st").textContent="guarding +"+ME+" — watching for 2nd unanswered calls";
  }catch(e){log("poll err: "+(e&&e.message||e));}
  let gFails=0;setTimeout(poll,state==="live"?1500:5000);
}
/* boot */
(async()=>{
  if(!ME){$("st").textContent="no num param";return;}
  const r=await api("register",{id:ME});
  if(!r||!r.ok){$("st").textContent="register failed: "+(r&&r.err);return;}
  if(r.aid){AID=r.aid;try{localStorage.setItem("ac_aid",r.aid);}catch(e){}}
  log("guardian online for +"+ME+" ("+r.name+")");
  lastSig=new Date().toISOString();lastMsg=new Date().toISOString();
  poll();ringLoop();
})();
</script>
</body></html>
